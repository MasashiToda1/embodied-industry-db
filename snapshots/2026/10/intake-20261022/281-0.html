<script src="https://www.huanqiu.com/csr/csr_new_m.js" defer=""></script><link rel="stylesheet" type="text/css" href="//rs1.huanqiucdn.cn/dp/api/assets?dp_csid=cse3pl8tdbi&dp_instanceid=dpe3plc9q0n&dp_commit=308dab855babaf198b9cb78248cbdc4ac85acc93&web_id=1&dp_path=layouts/csr_m_article/csr_m_article.css">

<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4RTpVc8Ma6e</textarea><textarea class="article-author"> </textarea><textarea class="article-host">tech.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">谋先飞崔汉青：筑牢物理仿真底座，推动具身智能加速走向产业落地</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">“对于具身智能与物理AI而言，AI与现实世界交互的数据却相对匮乏。”在第九届数字中国建设峰会期间，谋先飞（Motphys）创始人兼CEO崔汉青在采访中表示。</textarea><textarea class="article-catnode">/e3pmh164r/e3pn4gh77</textarea><textarea class="article-content"><article><section data-type="rtext"><p>【环球网科技报道 记者 郑湘琪】随着智能经济浪潮从虚拟的信息海洋涌向现实的物理世界，一个关键议题被推到聚光灯下：当人工智能不再仅仅是处理文字与图像，而是要驱动机械臂精准抓取、指挥农机自主穿行于田野时，高质量的“数据养料”从何而来？物理世界复杂多变的逻辑又如何被精准复刻？</p><p>“大模型的发展依托于互联网数十年积累的海量公开数据，但对于具身智能与物理AI而言，AI与现实世界交互的数据却相对匮乏。”在第九届数字中国建设峰会期间，谋先飞（Motphys）创始人兼CEO崔汉青在采访中表示。</p><p><img data-alt="谋先飞（Motphys）创始人兼CEO崔汉青" src="//img.huanqiucdn.cn/dp/api/files/imageDir/db5d7e928ed274307428b633ba686f22u1.png?imageView2/2/w/750" /></p><p>国机数科总架构师、智能工业事业部总经理殷飞龙则坦言，“工业领域对数字孪生的呼唤由来已久，但过去大量实践止步于可视化大屏，并未触及物理规律的真正复现。”基于此，具身仿真技术与产业场景的深度融合，让此前各自探索的双方迅速找到了交汇点，并共同勾勒出一幅从技术突破到产业落地的合作蓝图。</p><p><em data-scene="strong">破局虚实之间：仿真技术何以</em><em data-scene="strong">打通</em><em data-scene="strong">AI训练的数据瓶颈</em></p><p>“当AI进入产业，首先绕不开的就是数据瓶颈。”崔汉青告诉记者，目前行业主要沿两条路径破局：一是靠真实场景采集，二是依靠虚拟环境生成数据。但前者面临人力成本高、效率有限的束缚，后者则长期受困于仿真精度不足的技术短板。</p><p>在崔汉青看来，精度短板并非无解，关键在于找准那条足以撬动产业逻辑的临界线。“可能我们永远无法做到百分之百和真实数据一样，但如果做到90%、95%，仿真数据的优势就会被极大地凸显出来——不需要人力成本，可以靠算力大规模并行快速产生海量数据。”</p><p>也正是基于这一判断，谋先飞选择了一条从底层物理引擎起步的路径。据介绍，谋先飞以自主研发的 MotrixSim 物理仿真引擎为底座，向上构建了覆盖具身智能全链路的产品体系：支持强化学习的 MotrixLab 训练平台、面向 3D 资产快速构建的 MotrixGen 生成工具，以及打通虚实之间的 Real2Sim2Real 合成数据管线。</p><p>这条技术路线近期获得了一项来自学界的验证。清华大学智能产业研究院DISCOVER Lab联合谋先飞等厂商共同研发的新一代国产仿真器GS-Playground被机器人领域国际顶级学术会议RSS 2026录用，标志着国内具身智能仿真基础设施在视觉保真度与训练吞吐量两个维度上同时取得了国际领先水平的突破。</p><p>而GS-Playground的核心物理引擎，正是谋先飞的MotrixSim。对此，崔汉青透露，在 GS-Playground 论文中，MotrixSim 与 MuJoCo等国际主流仿真器进行了系统性对比。实验结果表明，MotrixSim 在接触密集场景的精确性与稳定性、高复杂度场景的并行扩展性，以及与视觉渲染管线协同的资源效率方面具有明确优势。</p><p>更长远地看，MotrixSim 的目标不止于仿真器本身。“我们希望以高性能仿真为核心，构建高质量、自动化的仿真数据合成管线，缓解具身智能领域长期面临的高质量训练数据匮乏问题，为机器人从仿真走向真实世界规模化落地提供坚实的基础设施。同时，我们也致力于解决具身智能科研工作者在仿真环节遇到的实际难题，降低高保真仿真的使用门槛，让研究者能够专注于算法创新而非工程调试。”崔汉青说。</p><p><em data-scene="strong">扎根实业沃土：以“数据闭环”加速农业与</em><em data-scene="strong">工业</em><em data-scene="strong">场景落地</em></p><p>将目光从实验室转向产业一线，工业与农业构成了仿真技术落地的重要阵地。其中农业场景更具挑战性，崔汉青坦言，“机器人在农业场景里要面对的是自然环境，与工业场景的刚体零部件相比，土壤、植物这些对象的仿真模拟难度要高很多。”但他同时谈到，“农业机械的智能化是一个确定性很高的方向。农业机械可以被理解为广义上的机器人，一样需要在上亿次试错中训练出自主作业的能力，这基本只能靠仿真环境来支撑。”目前，谋先飞在农业领域持续探索，在水果采摘等小规模场景中已经开展试点。</p><p>如果说农业场景考验的是仿真的复杂度上限，那么工业场景考验的则是降本增效的实际账本。崔汉青认为，目前仿真在工业端的落地处于探索期，在这一阶段仿真的核心价值是大幅降低试错成本。“企业在仿真场景里更换机器人型号是零成本的，不需要购买真机，调试各种算法也只需要算力，不需要停产、不需要重新搭产线。”</p><p>这意味着，企业可以在虚拟环境中将不同品牌、不同构型的机器人放到同一个任务下反复测试，找到最优方案后再投入实际部署。企业如果在任何一个环节发现问题，都可以通过数据闭环倒回去优化，每轮循环都会让仿真精度更高。</p><p>谋先飞与国机数科的战略合作，正是在这样的产业判断下加速推进的。今年4月，双方签署战略合作框架协议，明确将围绕工业场景下的具身智能仿真训练与落地应用展开深度合作。据崔汉青介绍，双方将合作重心锁定在制造业密集的长三角地区，沿着三条主线展开：一是依托国机数科在长三角的工业网络，建设可直接服务产线的具身智能仿真训练场；二是结合制造工艺流程，优先构建高价值的工业仿真数据场景，推动合成数据在AI训练中的规模化应用；三是面向工业机器人训练验证与仿真评估等需求输出联合解决方案，从长三角起步，逐步辐射全国工业客户。</p><p>殷飞龙谈到，此次战略合作立足于国机数科深厚的工业场景资源与行业网络，以真实工业环境为锚点，以谋先飞的 MotrixSim 仿真引擎为底座，输出全链路仿真能力，将真实工业场景还原为高保真仿真环境，再以仿真反哺真实，最终形成从工业场景数字化到仿真训练、策略验证，再到实体落地的完整闭环。</p><p>对于这种“技术方+场景方”的搭档模式，殷飞龙将其概括为生态合作的必然。在他看来，具身智能的核心不在硬件本体的单项突破，而在背后驱动其运转的数据与训练体系，国机数科与谋先飞的角色咬合，正好补上了产业链上关键的一环。</p><p>与合作深化同步推进的，是谋先飞整套技术体系的国产化适配。崔汉青表示，谋先飞的MotrixSim引擎已先后完成鲲鹏双认证——Kunpeng COMPATIBLE兼容性认证与Kunpeng NATIVE同辕开发技术认证。此外，谋先飞也与天数智芯完成联合测试认证，确保了从底层算力到仿真应用的全栈协同优化。</p><p>谈及行业前景，崔汉青强调，“我相信具身智能最好的土壤一定在中国，因为造机器人的供应链在这里，用机器人的场景也在这里。但机器人的产业落地不会那么快，所以业界需要直面磨合期。在这样的背景下，谋先飞将持续夯实物理AI基础设施的底座，以期推动具身智能走向更广阔的产业一线，助力智能经济新形态的加速崛起。”</p><p><video controls src="https://v6.huanqiucdn.cn/4394989evodtranscq1500012236/1d044b215145403726006458862/v.f100830.mp4" data-alt="" poster="https://v6.huanqiucdn.cn/4394989evodtranscq1500012236/1d044b215145403726006458862/sampleSnapshot/sampleSnapshot_10_0.jpg"></video></p></section></article></textarea><textarea class="article-time">1778226881905</textarea><textarea class="article-copyright">环球网版权作品，未经书面授权，严禁转载或镜像，违者将被追究法律责任。</textarea><textarea class="article-editor-name">责编：窦鹏</textarea><textarea class="article-source-name">环球网</textarea><textarea class="article-ext-xtime">1778226881905</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover">//img.huanqiucdn.cn/dp/api/files/imageDir/db5d7e928ed274307428b633ba686f22u1.png</textarea><textarea class="article-keyboarder">{"email":"zhengxiangqi@huanqiu.com","name":"郑湘琪"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><script>function decodeEntities(encodedString) {
