description: 移动操作机器人公司，Carri FLEX 具备按按钮、推拉、抓放等上肢操作能力。2025 年 12 月被 Grab 收购。公开文件列明境内关联公司包括推移机器人科技（苏州）有限责任公司、北京推行科技有限责任公司；上海徐汇报道将象其物宜（上海）人工智能科技有限公司称为推行科技。
