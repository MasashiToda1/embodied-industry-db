title:
  zh: 兆威机电在第二十六届高交会首发手指集成驱动的灵巧手，整手 17 个主动执行单元
summary:
  zh: 11 月 14 日，证券时报报道称兆威机电在第二十六届中国国际高新技术成果交易会举办新品发布会，推出手指集成驱动的高可靠灵巧手。报道称该灵巧手采用单关节驱动技术，整手配备 17 个主动执行单元，单指可达 3 个及以上主动执行单元；公司自研柔顺控制算法，面向工业生产、特种作业、生活服务等场景。
