title:
  zh: 中科慧灵发布首款全尺寸双足人形机器人灵宝 CASBOT 01
summary:
  zh: 11 月 13 日晚，北京中科慧灵机器人技术有限公司通过线上直播发布首款全尺寸双足人形机器人灵宝 CASBOT 01（又名「星期三」）。整机身高 179cm、体重 60kg，内置 52 个自由度、550 TOPS 算力，续航超过 4 小时，自研行星、谐波、直线三大系列一体化关节，峰值扭矩密度最高 207Nm/kg。公司称 CASBOT 01 尚未批量生产，计划 2025 年迭代 1—2 轮后再考虑小批量生产，潜在客户覆盖航空航天、危险作业、工业制造、商业服务。
