title:
  zh: 乐聚中标一汽公开招标的人形机器人项目
summary:
  zh: 2024 年 11 月，一汽向全行业发起国内汽车行业首个公开招标的人形机器人项目，针对工厂物流自动化难题，乐聚团队中标。报道称一汽基于工业真实场景对中标的人形机器人软硬件提出 68 项要求，乐聚围绕「硬件—控制—感知」迭代开发，用 3 个月突破作业效率、负载行走、长时间稳定作业等问题。公开报道未披露中标金额。
