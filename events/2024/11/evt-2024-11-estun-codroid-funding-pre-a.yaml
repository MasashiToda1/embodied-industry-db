title:
  zh: 埃斯顿酷卓完成 1.3 亿元融资，首次引入外部投资人
summary:
  zh: 南京市国资委发布消息，江苏南京软件和信息服务产业专项母基金直投项目投决会审议通过南京埃斯顿酷卓科技有限公司投资项目并完成投资协议签署。这是埃斯顿酷卓首次引入外部投资人，专项母基金投资 3000 万元，撬动国家先进制造业基金 1 亿元，共同助力企业完成 1.3 亿元融资目标。
