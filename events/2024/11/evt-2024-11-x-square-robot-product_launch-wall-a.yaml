  zh: 自变量机器人对外披露 Great Wall 系列端到端统一具身大模型 WALL-A
summary:
  zh: 2024 年 11 月，自变量机器人对外披露其 Great Wall 操作大模型系列的 WALL-A 模型。公司在采访中称该模型从最原始的视频与传感器信号直接输出机器人的速度、位姿、力矩，中间不做分层切分，并且所有操作任务在同一个模型中训练和推理。
