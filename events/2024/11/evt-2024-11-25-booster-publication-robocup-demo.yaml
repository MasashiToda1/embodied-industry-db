summary:
  zh: 11 月 25 日，加速进化在 GitHub 账号 BoosterRobotics 下创建并公开 robocup_demo 仓库，仓库描述写明这是 Booster T1 与 K1 的 RoboCup 官方示例，使机器人能够自主参与足球比赛。仓库后续维护了适配新版 RoboCup 规则与 GameController 的分支，涵盖比赛通信行为、5v5 比赛支持与哨声检测。
