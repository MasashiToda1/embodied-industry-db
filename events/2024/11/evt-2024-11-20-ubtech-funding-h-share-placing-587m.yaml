title:
  zh: 优必选按一般授权配售 700 万股新 H 股，所得款项总额约 5.8716 亿港元
summary:
  zh: 港交所公告显示，优必选于 2024 年 11 月 20 日与配售代理订立配售协议，按每股 83.88 港元配售合共 700 万股新 H 股，占经扩大后已发行股本约 1.62%。公告载明所得款项总额及净额估计分别约为 587.16 百万港元及 551.88 百万港元，净发行价约每股 78.84 港元，用于业务运营和发展及偿还授信业务到期金额。
