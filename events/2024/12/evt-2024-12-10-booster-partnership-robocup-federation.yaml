title:
  zh: RoboCup 联盟宣布与加速进化建立合作伙伴关系
summary:
  zh: RoboCup 联盟（RCF）发布公告，宣布与加速进化、傅利叶、宇树三家公司建立合作关系，目标是推动人形机器人研究与教育，并促成这些公司的人形机器人参与 RoboCup 赛事。公告写明三家公司承诺利用自身商业网络推动 RoboCup 相关项目研究与产品的资助或商业化，并共享传播渠道资源。加速进化官网新闻中心以「加速进化成为 Robocup 官方合作伙伴！」收录该消息。
