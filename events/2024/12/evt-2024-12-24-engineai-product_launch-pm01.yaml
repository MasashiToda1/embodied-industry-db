title:
  zh: 众擎机器人发布人形机器人 PM01，商业版与教育版统一售价 8.8 万元
summary:
  zh: 12 月 24 日，深圳市众擎机器人科技有限公司发布人形机器人新品 PM01。该机器人身高 1.38 米，体重约 40 公斤，全身 24 个自由度，移动速度每秒 2 米，腰部装有 320 度自由旋转电机，具有机械式步态和类人自然步态两种行走模式，借助光学动捕技术采集人体运动数据并通过强化学习和模仿学习提高拟人程度。发售自当日起至 2025 年 3 月 31 日，商业版与教育版均以 8.8 万元的统一价格面向市场发售。
