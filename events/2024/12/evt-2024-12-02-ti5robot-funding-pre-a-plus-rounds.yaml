title:
  zh: 钛虎机器人连续完成 Pre-A+ 与 Pre-A++ 两轮融资
summary:
  zh: 12 月 2 日，钛虎机器人科技（上海）有限公司宣布连续完成 Pre-A+ 和 Pre-A++ 两轮融资，Pre-A 系列合计融资金额超过一亿元人民币。Pre-A+ 轮由凡创资本和锦冠资本投资，Pre-A++ 轮由毅达资本、商汤国香资本和江阴人才基金联合投资，老股东经纬创投连续两轮跟投。
counterparties:
- 凡创资本
- 锦冠资本
- 毅达资本
- 商汤国香资本
- 江阴人才基金
- 经纬创投
