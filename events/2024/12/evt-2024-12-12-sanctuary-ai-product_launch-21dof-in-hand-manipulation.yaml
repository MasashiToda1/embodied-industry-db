title:
  zh: Sanctuary AI 公布 21 自由度液压灵巧手可做手内操作
summary:
  zh: 12 月 12 日，Sanctuary AI 宣布其 21 自由度灵巧机械手可完成手内操作（in-hand manipulation）。公司称这套手依靠自研的微型液压阀实现驱动，比线缆与机电方案的功率密度高一个数量级，在速度、力量、可控性、循环寿命、抗冲击与散热上有优势。公告称液压阀执行器已完成超过 20 亿次循环测试，未出现泄漏或性能衰减。新增的灵巧能力产生的行为数据用于训练其 AI 控制系统 Carbon；Carbon 与灵巧手均按模块化设计，可与非人形与人形通用机器人集成。
