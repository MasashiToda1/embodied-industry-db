title:
  zh: 云深处 X30 四足机器人交付新加坡能源集团电力隧道巡检方案
summary:
  zh: 12 月 11 日，云深处科技宣布与官方合作伙伴 Eastern Green Power（EGP）合作，采用自研 X30 四足机器人和数字化技术，交付新加坡能源集团（SP 集团）电力隧道巡检解决方案。SP 集团将该机器狗命名为「SPock」，配备视频摄像头和热成像仪，在管廊内自主导航、实时发现缺陷并生成数据报告，官方称预估每年节省人工隧道检查时间 480 小时。官网稿称 X30 是国内第一台在海外电力系统落地应用的行业级四足机器人。
counterparties:
