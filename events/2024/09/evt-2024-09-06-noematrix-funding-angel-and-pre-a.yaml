summary:
  zh: 9 月 6 日，穹彻智能宣布完成天使轮和 Pre-A 轮两轮融资，官网表述为「累计数亿元人民币」。Pre-A 轮由 Prosperity7 Ventures 与广发信德联合领投，泽羽资本、创新工场、奇绩创坛、璞跃中国、MFund 魔量资本等参投；天使轮由小苗朗程领投，MFund 魔量资本、京海展悦、无限基金 SEE Fund 等参投。资金用于产品研发、商业化拓展与人才招募。
