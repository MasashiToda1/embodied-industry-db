title:
  zh: 波士顿动力发布 Spot SDK v4.1.0
summary:
  zh: 9 月 23 日，波士顿动力在 GitHub 上发布 Spot SDK v4.1.0。官方发布说明列出的新功能包括：Autowalk 支持预设的人机交互行为（新增 hri_behaviors 字段，发现异常时机器人会点两下左前足）与多充电桩；新增 CreateMissionText 与 BosdynQueryStoredCaptures 两种任务节点类型；Python SDK 支持异步流式调用；数据采集存储可用 StoreDataStream 单次 RPC 存入超过 100 MB 的文件；GraphNav 新增 UploadGraphStreaming 与 DownloadGraphStreaming，支持超过 4 MB 的地图；Keepalive 服务结束 beta 阶段并已用于 Spot、平板与 Orbit；MobilityParams 新增 hazard_detection_mode 字段用于识别并绕开危险区域。同时列出了三项破坏性变更。
