summary:
  zh: 众擎机器人在 GitHub 开源 engineai_humanoid。README 写明这是深圳市众擎机器人科技有限公司双足机器人的运动控制算法，基于 MIT 的 Cheetah Software 运动控制算法，包含机器人建模与闭链映射算法、参数配置、LCM 日志调试类型、强化学习部署算法（已完成）以及基于模型的规划与控制模块（进行中）；sim2sim 仿真环境当时由其强化学习训练仓库 engineai_legged_gym 提供。
