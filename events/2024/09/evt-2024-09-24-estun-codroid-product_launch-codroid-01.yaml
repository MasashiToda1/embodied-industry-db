title:
  zh: 埃斯顿酷卓在上海工博会首发人形机器人 CODROID 01
summary:
  zh: 埃斯顿酷卓在 2024 年第二十四届中国国际工业博览会上首发人形机器人 CODROID 01，现场展示手部动作与工件抓取、转移动作。官方介绍该机型身高 170cm、重量小于 80kg、单臂负载 5kg、步速 3km/h，单臂自由度 7、单腿自由度 6、全身最大自由度 44、灵巧手自由度 6—7，采用一体化关节模组，核心部件全自研。
