  zh: 10 月 13 日，韩国《电子新闻》报道彩虹机器人向日本丰田供应移动双臂机器人 RB-Y1，丰田此前一直在评估采购、此次最终确定导入。报道称具体数量未获确认，丰田为验证与汽车生产结合的可能性而购买。彩虹机器人方面对是否供货丰田回应「客户相关内容无法具体确认」。
