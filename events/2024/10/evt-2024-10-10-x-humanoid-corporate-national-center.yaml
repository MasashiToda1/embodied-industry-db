title:
  zh: 北京具身智能机器人创新中心升级为国家地方共建具身智能机器人创新中心
summary:
  zh: 10 月 10 日，工业和信息化部与北京市政府在京举行揭牌仪式，北京具身智能机器人创新中心正式升级为「国家地方共建具身智能机器人创新中心」。该中心于 2023 年 11 月在北京经济技术开发区成立。升级后中心将推动具身智能产业标准制定、降低企业研发与中试成本。
