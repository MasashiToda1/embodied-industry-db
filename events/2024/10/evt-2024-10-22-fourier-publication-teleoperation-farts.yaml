summary:
  zh: 傅利叶在 GitHub 开源 teleoperation 仓库（Fourier Advanced Robot Teleoperation System，F.A.R.T.S.）。README 说明该系统用 VR 头显与手部追踪实时控制人形机器人，主要面向傅利叶 GRX 系列（GR1T1、GR1T2、GR2），也可适配其他机器人，支持 Depthai Oak、Intel RealSense D435 与通用 USB 相机，头显支持 Apple Vision Pro 与 Meta Quest 3，并包含面向模仿学习与 VLA 的数据采集功能。
