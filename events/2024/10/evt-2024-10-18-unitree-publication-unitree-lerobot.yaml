title:
  zh: 宇树科技开源 unitree_lerobot 数据转换与训练验证仓库
summary:
  zh: 宇树科技在 GitHub 开源 unitree_lerobot 仓库，用于 LeRobot 训练验证与宇树数据转换，支持 LeRobot 数据集 2.0 及以上版本。仓库包含训练代码目录、宇树数据处理工具与实机推理验证模块，README 列出 v0.1 支持 G1 + Dex1 + Dex3 的数据转换、模型部署与实机测试，v0.2 增加 BrainCo 与因时灵巧手的数据转换和模型部署、数据集回放及仿真环境验证。
