title:
  zh: 西湖机器人推出首个商业化产品四足机器人「小西」并启用量产计划
summary:
  zh: 每日商报稿件写明西湖机器人于 2024 年 10 月推出第一个商业化产品「小西」并启用量产计划，这是该公司对外正式交付的第一台四足机器人。稿件写明「小西」体重 14 公斤，采用航天级碳纤维骨架，体形比市面上已有的最小款机器人再缩小 30%，可承载 5 公斤物品；搭载高精度激光雷达和摄像头，能自主规划路线、避开障碍物，并通过语音与老人互动，实现递送物品、陪伴散步等功能。
