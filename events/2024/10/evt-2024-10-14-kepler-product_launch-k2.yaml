title:
  zh: 开普勒发布全尺寸通用人形机器人先行者 K2
summary:
  zh: 上海开普勒机器人有限公司自主研发的全尺寸通用人形机器人先行者 K2 正式全球发布，并在 10 月 14 日开幕的 GITEX GLOBAL 2024 上首度公开亮相。K2 身高 175 厘米、体重 83 公斤，采用新一代绳驱触觉灵巧手，单手多达 11 个自由度，单手负载能力可达 15 公斤，每个指尖配备高达 96 个触点的柔性传感器。K2 适用于智能制造、仓储物流、特种作业、科研教育等领域。
