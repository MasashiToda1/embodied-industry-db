title:
  zh: Duatic 入选 Venture Kick 第一阶段，获 4 万瑞士法郎早期资助
summary:
  zh: 6 月 25 日，瑞士早期创业资助机构 Venture Kick 宣布 Duatic、Grensol 与 SecondWave Photonics 入选其第一阶段财务与创业支持，Duatic 获 4 万瑞士法郎。Venture Kick 称 Duatic 提供全栈机器人移动操作方案，团队来自 ETH 机器人研究，自研机械臂与机器学习技术紧密集成。这是 Duatic 目前唯一公开的融资信息。
