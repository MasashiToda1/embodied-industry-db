  zh: 8 月 17 日晚间，宇树科技发布上市公告书，股票于 8 月 19 日在上交所科创板挂牌交易，证券代码 688836.SH，发行价 150.8 元/股，本次公开发行 4044.64 万股，占发行后总股本的 10%。报道称从 3 月 20 日受理到 7 月 2 日注册生效全程 104 天，网上发行中签率 0.01809759%。
