summary:
  zh: 8 月 12 日，深圳通用机器人操作系统研发商桥介数物（BridgeDP Robotics）宣布完成 Pre-A+++ 轮融资，由中国移动链长基金领投，老股东复星创富、深创投追加投资，融资规模达亿元级。公司称资金用于 RoboCraft AI 运动能力开发平台生态建设、跨本体全身运动数据工厂产能提升、运动控制模型迭代以及海外技术服务体系布局。
