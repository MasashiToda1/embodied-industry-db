summary:
  zh: 8 月 19 日，鹿明机器人在 2026 世界机器人大会首发机器人技能进化引擎 Lumos NexCore，打通任务定义、数据接入、模型训练、技能评测、部署运行到持续学习的链路，采用平台订阅加训练算力、真机验证和技能授权的组合收费模式；同场展出第二代重载轮臂式机器人 MOS2，双臂负载 50kg。
