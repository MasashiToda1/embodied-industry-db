title:
  zh: 百度智能云在 2026 世界机器人大会与贝塔无限、中亿具身、拓元智慧、超脑未来签署具身智能合作协议
summary:
  zh: 8 月 19 日，2026 世界机器人大会首日，百度智能云与贝塔无限、中亿具身、拓元智慧、超脑未来签署合作协议：与贝塔无限共建通用具身智能技术支撑平台，与中亿具身建设群体智能云端大脑、云端仿真平台与专业数据集，与拓元智慧围绕 VWA 世界动作模型、云端训练和具身数据闭环合作，与超脑未来共建群体智能 AI Infra。文中引用 IDC 报告称百度智能云以 29.55% 份额位居中国具身智能云市场第一。
