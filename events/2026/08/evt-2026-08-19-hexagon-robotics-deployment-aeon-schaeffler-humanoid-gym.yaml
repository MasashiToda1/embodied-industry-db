title:
  zh: AEON 进入舍弗勒德国「Humanoid Gym」按训练—验证—部署流程做工厂前训练，未来六个月加速多用例部署
summary:
  zh: 8 月 19 日，Hexagon Robotics 与舍弗勒宣布 AEON 人形机器人进入舍弗勒在德国的 Humanoid Gym。该设施提供「训练—验证—部署」模式的专用工业环境，双方在其中教 AEON 新的工业能力并培养舍弗勒运营、训练与集成人形机器人的能力。公司称训练将在未来六个月内加速 AEON 在舍弗勒制造流程多个用例中的部署，支撑此前宣布的至少 1000 台 AEON 部署计划；舍弗勒同时向 AEON 供应执行器技术。
