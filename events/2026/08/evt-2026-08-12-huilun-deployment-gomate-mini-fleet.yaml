summary:
  zh: 据公司披露，第四代轮足式人形机器人 GoMate Mini 已在 7 个代表性项目部署近 50 台，最长单项目运行 12 个月，累计运行约 6.3 万公里，处置异常约 18.9 万次，落地高端园区、商业综合体、地铁枢纽等场景，采用销售加租赁组合模式，成立半年内获近千万元订单。
