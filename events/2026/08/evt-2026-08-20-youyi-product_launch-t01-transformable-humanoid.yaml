title:
  zh: 有怡科技在 WRC 2026 发布可变形「本质人形」机器人 T01
summary:
  zh: 8 月 20 日，金华有怡科技有限公司在 2026 世界机器人大会上提出「本质人形」理念并发布首款本质人形机器人 T01。T01 为可变形多模态机器人，将双足双臂四个肢体机构减少为腿臂复用的两个肢体机构，自重 30kg，设计速度 3m/s，具备双足行走、轮式移动、双臂作业、箱体收纳功能，可作为驾乘工具搭载 100kg 成年人。
