title:
  zh: GI Labs 发布 EGO1GS 采集头显与 EgoHand
summary:
  zh: GI Labs发布用于机器人学习的EGO1GS第一视角采集头显及端侧EgoHand手部检测模型。官方参数为双目1080p、30fps全局快门相机、400Hz九轴IMU及双麦克风音频，使用共同硬件时钟同步。EgoHand识别佩戴者双手并在采集时提供反馈；400Hz指IMU采样率，不是相机帧率。
