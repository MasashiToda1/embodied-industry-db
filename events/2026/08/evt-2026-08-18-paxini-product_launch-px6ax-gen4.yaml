title:
  zh: 帕西尼发布第四代多维触觉传感器系列 PX6AX GEN4，搭载自研 6D 触觉感知芯片 GEN4 FUSE
summary:
  zh: 8 月 18 日，帕西尼发布搭载自研 6D 触觉感知芯片 GEN4 FUSE 的第四代 ITPU 多维触觉传感器系列 PX6AX GEN4，包括 Superior（旗舰指尖 / 指腹 / 掌心）、Neuron（全身电子皮肤）、Gripper（夹爪触觉模块）三个新形态，并对 Elite、Core、Omega 系列升级。公司称近一年自研芯片累计消耗量突破 100 万颗，模组厚度 1.9mm。
