title:
  zh: 开普勒完成工商变更登记，成为杭州柯林控股子公司
summary:
  zh: 8 月 20 日，杭州柯林公告称，收购开普勒 41.57% 股权事项已于 2026 年 6 月 5 日经 2026 年第一次临时股东会审议通过，开普勒近日完成工商变更登记并换发《营业执照》。变更完成后杭州柯林持有开普勒 51.00% 股权，开普勒成为其控股子公司并纳入合并报表。公告载明开普勒成立日期为 2023 年 8 月 15 日，注册资本 410.5661 万元，法定代表人杨华。
