title:
  zh: 上纬新材半年报：启元与蓝思智能达成首期万台级机器人产线合作，预收货款 2.1 亿元
summary:
  zh: 上纬新材 2026 年半年报（8 月 15 日报道）披露，公司与蓝思科技子公司蓝思智能达成首期规划万台级机器人的产线合作，已与 20 余家核心渠道商签署合作协议；报告期内消费级具身智能机器人首批订单对应预收货款 2.1 亿元，尚未确认收入。上半年机器人业务研发投入约 1.6 亿元。
