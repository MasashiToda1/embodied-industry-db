title:
  zh: 奥比中光在 WRC 2026 发布机器人视觉新品 Physis 系列与无本体数据采集硬件矩阵
summary:
  zh: 8 月 19 日，2026 世界机器人大会首日，奥比中光举行「多维感知」新品发布会，发布机器人视觉新品 Physis 系列（瞳距 RGB 双目 Physis 257g 与单目 RGB Physis 157g），无本体数据采集硬件矩阵（EGO、UMI、WristCam、Hub）首次集中亮相；同时推出双目 3D 相机 Gemini 338Le 与 Gemini 338Lg。
