summary:
  zh: 2026 世界机器人大会（8 月 19 日至 23 日）期间，青瞳视觉联合灵巧智能发布高精度便携式多模态数据采集系统 OptiUMI，由两支 OptiUMI 手持夹爪与一台 P3H 头戴动捕相机组成，以头戴式红外光学追踪实现亚毫米级三维定位，同步采集 RGB、6DoF 位姿与力觉数据，硬件同步误差 ≤50μs，6DoF 位姿输出 120fps。
