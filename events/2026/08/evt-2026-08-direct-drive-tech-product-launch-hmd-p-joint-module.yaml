title:
  zh: 本末科技在 WRC 2026 发布 HMD-P 系列一体化机器人关节模组，面向协作机器人与人形机器人
summary:
  zh: OFweek 机器人网报道，2026 世界机器人大会（8 月 19—23 日，北京）期间，本末科技核心部件事业部展出直驱动力模组、具身关节模组全系列产品，并现场发布新品 HMD-P 系列一体化机器人关节模组；该系列采用自研高扭矩密度无框力矩电机与精密行星减速器一体化集成设计，公司称可面向协作机器人、人形机器人及高端精密装备提供一体化执行方案。同场展示刑天、TITA、D1 等整机。
