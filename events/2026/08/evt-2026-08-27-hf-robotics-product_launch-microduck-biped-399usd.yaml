title:
  zh: Hugging Face 旗下 Pollen Robotics 发布 25 cm 双足小机器人 Microduck，开源、预售价 399 美元，一周售出逾 1 万台
summary:
  zh: 8 月 27 日，Hugging Face 机器人团队 Pollen Robotics 发布双足机器人 Microduck：身高 25 cm、重量不到 800 g、15 个电机，配相机、小型深度传感器、两个 IMU 与可抓物的可动鸟嘴，能行走、蹲坐、摔倒后起身与滑轮滑行；软件栈开源，可在仿真中用强化学习训练新行为后部署到实机。当日开放预售，起售价 399 美元（不含税与运费），四种配色，首批交付目标为 2026 年圣诞节前（北美、欧洲、英国）。CNBC 9 月 1 日援引 Hugging Face 称上市后售出逾 1 万台、销售额超 500 万美元，新订单交付期已推迟到圣诞节之后。
