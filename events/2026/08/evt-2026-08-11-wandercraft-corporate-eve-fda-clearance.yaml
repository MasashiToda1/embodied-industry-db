title:
  zh: Wandercraft 个人自平衡外骨骼 Eve 获美国 FDA 510(k) 许可（K260381），适用于任何损伤节段的脊髓损伤成人
summary:
  zh: 8 月 11 日，Wandercraft 宣布其个人自平衡外骨骼 Eve 获得美国 FDA 许可。FDA 510(k) 数据库记录为 K260381，申请人 Wandercraft SAS（巴黎），受理日期 2026 年 2 月 5 日，决定日期 2026 年 8 月 3 日，结论为实质等同（SESE），适用于任何神经损伤节段的脊髓损伤成人。许可依据为三家机构参与的临床试验（James J. Peters VA 医疗中心、Kessler Foundation、Walk in New York）。公司计划 2026 年 9 月 17 日在美国商业上市。
