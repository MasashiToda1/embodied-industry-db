title:
  zh: 新松发布 OneHub 羿枢多机器人协同系统
summary:
  zh: 8 月 19 日，新松在北京世界机器人大会发布 OneHub 羿枢多机器人协同系统，定位为面向具身智能规模化应用的异构机器人统一智能底座。系统采用大脑层、小脑层、执行层三级协同架构，将不同本体结构、控制方式与通信协议的机器人统一接入调度；现场调度多台松羿轮式人形机器人进行集群作业演示，面向柔性制造、智慧物流、智能巡检和复杂服务场景。
