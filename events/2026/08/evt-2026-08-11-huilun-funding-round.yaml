summary:
  zh: 广汽集团孵化的广东慧仑科技有限公司宣布完成超亿元融资，由中车国创基金、招银国际、四川科创、天成自控、中天控股集团等联合投资，诚一资本担任财务顾问。资金将投入垂类模型优化、汽车产线与综合服务场景拓展、核心硬件迭代与人才建设。
