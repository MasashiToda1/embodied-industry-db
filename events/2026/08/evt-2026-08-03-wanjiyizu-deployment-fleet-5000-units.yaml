title:
  zh: 万机易租披露平台可调度合作机器人超 5000 台，接入优必选、越疆、自变量、魔法原子等厂商
summary:
  zh: 8 月 3 日报道，万机易租平台可调度合作机器人规模超 5000 台，合作企业包括优必选、越疆、自变量、魔法原子、优理奇、鲸鱼 AI 教育机器人、大咖机器人等，已在文旅、商演、展会、零售、办公、教育、酒店等场景交付项目。平台以 App 与微信小程序为载体，业务含新机销售、二手设备流转、定制开发、维保检修、零配件供销。
