title:
  zh: 零次方机器人小店在合肥四点位同步落地，公司称订单规模突破 3 亿元
summary:
  zh: 新浪财经 8 月 21 日报道，零次方以 Zerith-H1 轮式人形机器人为核心的无人机器人小店将于 8 月 26 日进驻合肥罍街东区、南区、合柴 1972、贡街四个点位；此前已在合肥骆岗公园、中国视界及上海宝山滨江实测，公司称单店日订单峰值 1103 单、周履约成功率 99.5%，2026 年 8 月订单规模突破 3 亿元，年内计划落地 500 个小店。
