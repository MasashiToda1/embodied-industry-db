title:
  zh: 柯力传感 2026 年上半年机器人力学传感器销售超 2000 只，4 月起月订单量突破千只
summary:
  zh: 柯力传感在 2026 年半年度评估报告中称，2026 年上半年机器人力学传感器业务由小批量生产向批量化供应过渡，自 4 月起月订单量持续突破千只，1 至 6 月累计销售超 2000 只，超过 2025 年全年销量；已累计向超过 90 家人形机器人、协作机器人及工业机器人企业送样，产品涵盖六维力 / 力矩传感器、关节力矩传感器。上半年公司直投体系完成对深朴智能、云幕智造等的战略投资，旗下产业基金完成对恒之未来等的战略投资。
