title:
  zh: RoboScience 机器科学发布轮式仿人形通用操作机器人 REX G1
summary:
  zh: 8 月 17 日，RoboScience 机器科学发布首款产品——轮式仿人形通用操作机器人 REX G1，搭载自研 VLOA 架构通用具身大模型 Visics，面向物流、工厂、零售及家庭场景。财经天下报道其全身 22 个关节自由度，双臂负载 10 公斤，端侧算力 2070 TFLOPS，续航最长 4 小时并支持热插拔换电，在 WRC 2026 首秀。
