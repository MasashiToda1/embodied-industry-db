  zh: 因时机器人在 2026 世界机器人大会首发 RH524J1 系列 24 自由度腱绳混合驱动灵巧手
summary:
  zh: 2026 世界机器人大会期间，因时机器人在 B405 展位完成 RH524J1 系列 24 自由度腱绳混合驱动灵巧手全球首发。该产品手指 22 个、手腕 2 个合计 24 个主动自由度，采用腱绳与直驱混合驱动架构，集成接近觉、触觉、深度视觉多维度感知。公司称微型伺服电缸年产能达 50 万台。
