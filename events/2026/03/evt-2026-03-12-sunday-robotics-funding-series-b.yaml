title:
  zh: Sunday 完成 Coatue 领投的 1.65 亿美元 B 轮融资，估值 11.5 亿美元
summary:
  zh: 3 月 12 日，Sunday 宣布完成超额认购的 1.65 亿美元 B 轮融资，估值 11.5 亿美元，由 Coatue 领投，Thomas Laffont 加入董事会，Bain Capital Ventures、Fidelity Management & Research Company、Tiger Global、Benchmark、Conviction、Xtal Ventures 等参投。公司称本轮资金用于停止做演示、全面转向 Memo 的真实家庭部署，Beta 交付将在数月内开始，目标 2026 年秋季进入家庭；官方博客称工程团队扩大 3 倍、研究 4 倍、数据运营 5 倍。
