  zh: 3 月 18 日，擎天租宣布完成天使轮及天使 + 轮两轮融资，累计融资金额「亿元级别」，由大洋电机、慕华科创、敏卓机电等领投，乐华娱乐、复琢投资、明嘉资本、睿资创投、天季投资、嘉兴南投、知行投资等跟投，老股东大丰实业超额认购。公司披露平台订单已超 5500 单，可调度机器人设备超 3000 台。
