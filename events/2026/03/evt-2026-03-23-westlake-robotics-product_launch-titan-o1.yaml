  zh: 西湖大学孵化的西湖机器人发布人形机器人「泰坦 o1」（Titan o1），搭载自研通用动作预训练大模型 GAE（General Action Expert）身外化身系统。报道称该系统可实时模仿人类动作、跨本体适配，一人可操控多台不同地点的机器人同步作业。
