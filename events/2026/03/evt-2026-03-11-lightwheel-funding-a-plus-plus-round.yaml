title:
  zh: 光轮智能完成 10 亿元 A++ 及 A+++ 轮融资，称成为全球首个具身数据领域独角兽
summary:
  zh: 3 月 11 日，光轮智能在官方公众号宣布近日完成 10 亿元人民币 A++ 及 A+++ 轮融资，产业投资方包括新希望集团、鼎邦投资（三安光电董事长家族办公室）、奥克斯、鼎石资管等，财务投资机构包括建投华科、国方创新、道禾长期投资、清新资本等。公司称本轮完成后成为全球首个具身数据领域的独角兽企业；资金投入物理仿真引擎研发、规模化模型评测体系升级与全球交付及本地部署能力建设。
