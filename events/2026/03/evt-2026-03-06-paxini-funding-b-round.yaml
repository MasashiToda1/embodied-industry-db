summary:
  zh: 帕西尼感知科技宣布完成超 10 亿元人民币 B 轮融资，公司估值超 100 亿元。本轮由黄浦江资本、凯泰资本、信安资本领投，珠海科技产业集团、善达资本、海川基金等联合投资，广州市新兴基金、优利德、知来资本、LEO LION、南岭基金、相城金控等跟投，毅达资本等老股东加码，庚辛资本中国担任独家战略财务顾问。
