title:
  zh: 荣耀首款人形机器人在 MWC 2026 巴塞罗那发布会亮相，同步宣布成立新产业孵化部
summary:
  zh: 3 月 1 日，荣耀在 MWC 2026 全球发布会上展示首款人形机器人，现场完成舞蹈、握手与翻跟头等动作，荣耀未公布名称、价格与详细参数。会后荣耀透露已成立新产业孵化部，下设具身智能实验室、具身数据实验室、交互安全实验室、动力总成实验室和仿生本体研究实验室；同场亮相的灵巧手 DexH13 为帕西尼感知科技与荣耀合作产品。
