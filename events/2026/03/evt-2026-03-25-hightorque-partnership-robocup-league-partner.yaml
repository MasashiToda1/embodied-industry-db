title:
  zh: 高擎动力获 RoboCup 国际理事会批准成为 RoboCup League Partner，Mini Pi Plus 作为人形足球赛事平台
summary:
  zh: 3 月 25 日，高擎动力官网发文称已获 RoboCup 国际理事会批准，成为 RoboCup League Partner（官方赛事合作伙伴），Mini Pi Plus 作为面向赛事与科研教育场景的人形机器人开发平台（全身 22 自由度，65cm / 13kg，搭载 NVIDIA Jetson Orin NX，支持 Isaac Lab、MuJoCo 仿真）。文中称面向参赛队伍提供折扣采购价格、赛事期间工程师现场支持，并推出 RoboCup 一站式开源教程平台。
