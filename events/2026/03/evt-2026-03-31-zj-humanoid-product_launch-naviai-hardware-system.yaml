title:
  zh: 浙江人形发布 NAVIAI 领航者硬件体系：U 系列双臂、WA 系列轮臂、I 系列双足及关节与控制器
summary:
  zh: 浙江人形机器人创新中心发布 NAVIAI 硬件体系，整机含 NAVIAI-U 系列双臂手作业人形（28—31 自由度）、轮臂式 NAVIAI-WA1/WA2、双足式 NAVIAI-I2/I3（I3 身高 180cm、最大步速 9km/h），配套 AH 系列谐波臂、JH 谐波关节与 JP 行星关节家族，以及 BC-275、BC-2070 大小脑一体化控制器。
