title:
  zh: 灵初智能宣布完成天使轮及 Pre-A 轮共计 20 亿元融资
summary:
  zh: 2026 年 3 月 10 日，灵初智能宣布已完成天使轮及 Pre-A 轮共计 20 亿元人民币融资。天使轮由国开金融、国中资本、央视融媒体产业投资基金、长飞光纤旗下基金、沃德尔、元生创投、珠海科技产业集团、钧山投资、燕缘创投、大米资本、沃赋资本、彬复资本等投资；Pre-A 轮由上海国资徐汇资本等领投，梁溪科创产业二期母基金、锡创投、普丰资本、钛铭资本跟投，华兴资本担任财务顾问。
