summary:
  zh: 3 月 29 日，因时机器人发布 RH56H1 系列灵巧手，定位小尺寸高性能执行器，面向具身智能与人形机器人应用。产品尺寸 159.70mm×75.18mm，六自由度、十一关节，单指最大输出力 15N，单指被动负载 8kg，控制频率 1000Hz，集成触觉传感器，支持 Modbus-RTU、EtherCAT、RS485 及 CANFD 通信协议。
