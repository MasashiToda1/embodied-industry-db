title:
  zh: 魔法原子完成 5 亿元新一轮融资，同步在无锡设立百亿级生态基金
summary:
  zh: 3 月 9 日，魔法原子宣布完成新一轮 5 亿元融资，投资机构包括天空工场创投基金、拓普集团、金雨茂物、苏大天宫、杰创智能、爱仕达、梁创投等，并引入宜宾宜发展旗下基金、武汉临空港旗下基金等地方国资。同时公司百亿级具身智能生态基金落地无锡，两项合计撬动资金规模超过 105 亿元。
