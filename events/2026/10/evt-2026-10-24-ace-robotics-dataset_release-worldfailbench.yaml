title:
  zh: 大晓机器人公开 WorldFailBench 失败评测数据
summary:
  zh: 大晓机器人在ACERobotics的Hugging Face仓库上传WorldFailBench数据包，并在官方GitHub提供配套说明。数据来自RoboTwin与LIBERO仿真闭环运行，分别包含5000和1500个评测episode的首帧及元数据，边界子集包含120组成功/失败配对和2400个rollout。数据用于失败原因、阶段及边界评测；不是实机采集数据，配套GitHub不另计一次数据发布。
