  "title": {
    "zh": "高擎公开电机通信工具链资料核验"
  },
  "summary": {
    "zh": "本次核验高擎官方五个仓库：motor_can_f446、motor_can_h730、motor_fdcan_h730 提供板级电机通信代码，hightorque_fdcan 提供 FDCAN 工具，hightorque_robot 提供按 YAML 配置管理多个 CAN 通道和电机的 C++ SDK。仓库保留更早开发历史，首次公开日期未核实；本条为公开资料核验，不是五次新品发布，也不认定10月8日为工具首次发布日期。"
  },
