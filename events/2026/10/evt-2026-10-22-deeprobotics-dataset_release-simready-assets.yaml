  zh: 云深处公开 SimReady 机器人仿真资产
summary:
  zh: 云深处在Hugging Face公开八款机器人USD资产包，包含DR02标准与Pro、M20S、M20、X30、S10、M20_Piper和Lite3，提供物料清单、验证结果及源文件许可声明。README区分模型制作规范检查与运行时物理测试，后者仍有失败、缺失和跳过项，NVIDIA审查尚未完成。该发布为仿真资产，不能作为实机采集数据或全部测试通过的证明。
