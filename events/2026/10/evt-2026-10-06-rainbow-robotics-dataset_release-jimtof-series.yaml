    "zh": "彩虹机器人公开 JIMTOF 系列 RBY1 操作数据"
  },
  "summary": {
    "zh": "官方 Hub 的 JIMTOF 仓库创建于10月2日，JIMTOF_1 创建于10月6日。10月7日核验的元数据分别记录8条轨迹、13658帧和21条轨迹、33268帧，均为 LeRobot v3.0、RBY1、1个任务、30 FPS，包含前方及左右视角视频、状态与动作。两个版本可能存在重叠，不相加为独立采集总量；未标注许可，不认定可自由商用。"
  },
