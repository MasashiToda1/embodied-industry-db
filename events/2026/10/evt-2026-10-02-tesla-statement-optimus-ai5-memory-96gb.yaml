title:
  zh: 特斯拉公开表态将 AI5 内存方案调整为 96GB
summary:
  zh: 据 Drive Tesla 10 月 2 日报道及其内嵌公开帖文，特斯拉在先前提出 AI5 使用 72GB LPDDR5 内存后，将方案调整为 96GB。报道将内存方案调整与
    Optimus 供货规模和成本联系起来；本条记录公开表态，不将其视为最终量产规格、已交付配置或实测性能。
