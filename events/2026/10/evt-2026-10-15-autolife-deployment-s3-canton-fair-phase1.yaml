title:
  zh: 智动未来披露小智 S3 在第140届广交会提供服务
summary:
  zh: 据霞光AI实验室对智动未来的采访，公司在第140届广交会8个主要点位部署16台小智S3，承担导览、零售、咖啡配送与会议迎宾等任务，报道的第一期统计区间为10月15日至20日。官网说明S3为融合感知、移动与双臂操作的轮式机器人。部署规模按受访方披露记录，不当作机器人销售或整个展期的完成交付。
