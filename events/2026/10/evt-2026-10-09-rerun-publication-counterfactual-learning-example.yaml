    "zh": "Rerun 公开机器人模仿学习工作流示例：检查演示数据、生成反事实变化、测量动作偏移、选择补充数据、微调策略并评估。示例以 ACT 与 MuJoCo 双臂方块转移任务贯通训练评测，并支持 LeRobot ALOHA 数据的离线分析，中间结果以 Rerun 记录、图层和表格保存。它是既有反事实学习方法的工具链实现，不是 Rerun 原创基础模型，也不证明真实机器人在线修复已完成。"
