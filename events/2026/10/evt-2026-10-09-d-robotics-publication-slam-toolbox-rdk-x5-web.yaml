  "title": {
    "zh": "地瓜机器人公开 SLAM Toolbox 的 RDK X5 适配及网页三维可视化"
  },
  "summary": {
    "zh": "地瓜机器人在上游 SLAM Toolbox 基础上提交 RDK X5 交叉编译适配、依赖裁剪和 slam_toolbox_web_node，通过 HTTP/WebSocket 提供地图、扫描、里程计与坐标变换的网页三维可视化。该事件记录平台移植和可视化工具扩展，不将上游二维 SLAM 算法归为地瓜自研；同日 hobot_msgs 的4K消息格式更新不合并为独立来源。"
  },
