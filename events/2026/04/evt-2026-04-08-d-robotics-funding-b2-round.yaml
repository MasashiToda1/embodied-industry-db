summary:
  zh: 2026 年 4 月 8 日，地瓜机器人宣布完成 1.5 亿美元 B2 轮融资，B 轮累计融资额达 2.7 亿美元。本轮由某零售科技与供应链巨头、Prosperity7 风投基金、远景科技集团等战略投资机构，慕华科创、云锋基金、华控基金（T-Capital）、LOOK CAPITAL、凯联资本等财务投资机构联合投资，老股东高瓴创投、和暄资本、线性资本、黄浦江资本、滴滴、五源资本、初心资本、梅花创投、Vertex Growth 跟投。文中称 2025 年全年出货量同比增长 180%，全球开发者数量突破 10 万。
