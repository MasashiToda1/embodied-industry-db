title:
  zh: 奇瑞墨甲全球发布会：智警机器人千台签约、百台集中交付，发布机器人租赁平台
summary:
  zh: 4 月 27 日，奇瑞墨甲全球发布会在安徽芜湖举行，人形机器人墨茵、智警机器人、导医机器人、机器狗集体亮相，现场完成智警机器人千台签约与百台集中交付，越南合作伙伴代表出席签约；同时发布机器人租赁平台，并与百家高校启动人才培养合作。
