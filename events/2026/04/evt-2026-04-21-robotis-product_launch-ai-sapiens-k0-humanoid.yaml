title:
  zh: ROBOTIS 公开开源人形平台 AI Sapiens 首款机型 K0：1.3 m、34 kg、23 自由度，搭载自研 DYNAMIXEL-Q 准直驱执行器
summary:
  zh: ROBOTIS 公开人形机器人平台 AI Sapiens 及首款机型 K0。K0 身高 1.3 m、重 34 kg、全身 23 个自由度（每腿 6、每臂 5、腰 1），单臂负载 3 kg，使用 14 个 QM-060 与 9 个 QM-080 DYNAMIXEL-Q 准直驱执行器，配 46.8 V / 9000 mAh 电池与 6 TOPS NPU。公司称硬件 BoM、CAD、源码与仿真资产将全部开源，DYNAMIXEL-Q 执行器计划 2026 年下半年发售；K0 整机售价未公布。
