title:
  zh: 苏度科技完成 5 亿美元 Pre-A 轮融资，估值突破 20 亿美元
summary:
  zh: 机器人前瞻 4 月 22 日报道，4 月 20 日苏度科技宣布完成 5 亿美元 Pre-A 轮融资，估值突破 20 亿美元，投资方包括宁德时代、阿里巴巴、高瓴创投、腾讯投资、蚂蚁集团、IDG 资本、蓝驰创投、孚腾资本、复旦科创、云晖资本、绿洲资本、国寿股权以及君联资本。苏度官方技术博客同日称公司近期完成新一轮融资，估值突破 20 亿美元，高鹄资本担任独家财务顾问。
