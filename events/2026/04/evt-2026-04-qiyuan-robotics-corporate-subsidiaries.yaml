title:
  zh: 上纬新材审议通过消费级具身智能机器人业务规划，设立启元上海、启元北京两家全资子公司
summary:
  zh: 上纬新材 2026 年半年报披露，公司于 2026 年 4 月审议通过消费级具身智能机器人新业务发展规划，并设立启元上海、启元北京两家全资子公司作为新业务独立载体；上海子公司启元新创为上海市人工智能重点项目。
