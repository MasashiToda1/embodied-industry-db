  zh: 灵童机器人推出桌面人形机器人「念」，启动 1000 台全球共创计划
summary:
  zh: 4 月 18 日，灵童机器人启动「你好·未来造物者」社区共创计划，面向全球开发者、科研人员与内容创作者免费发放 1000 台桌面人形机器人「念」用于二次开发与内容共创。产品高约 60 厘米，集成 30 个自研力矩关节舵机、30 个自由度，可站立、行走、转身、蹲起及舞蹈。5 月 22 日报道称有效报名已超 5000 人。
