title:
  zh: 阿里旗下高德公开首款四足具身机器人途途，在亦庄人形机器人半马首次亮相
summary:
  zh: 4 月 19 日，阿里巴巴旗下高德公开首款具身机器人产品途途，为四足机器人形态，定位智能导盲犬，在 2026 北京亦庄人形机器人半程马拉松赛场首次公开演示，协助一位视障人士完成规避动静态障碍、穿越狭窄通道、穿行密集人群等任务。证券时报称这是阿里巴巴在具身智能硬件上的首次正式亮相。
