title:
  zh: NEURA Robotics 与 Dassault Systèmes 合作，以 3DEXPERIENCE 虚拟孪生镜像 NEURA Gym 训练单元与客户现场，首期接入 4NE1
summary:
  zh: 4 月 23 日，NEURA Robotics 与 Dassault Systèmes 在汉诺威宣布合作，将 NEURA 的 Physical AI 生态与 Dassault 的 3DEXPERIENCE 平台连接：每个实体 NEURA Gym 训练单元和已部署客户环境都可在该平台上建立 AI 驱动的虚拟孪生，用真实数据与合成数据生成、验证和优化机器人技能。首期将人形机器人 4NE1 接入该虚拟孪生生态，后续扩展到其他形态。
