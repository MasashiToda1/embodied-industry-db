title:
  zh: 兴泰资本完成对意优科技投资交割，推动其在合肥落地子公司
summary:
  zh: 合肥在线 4 月 8 日报道，兴泰资本完成对上海意优智控科技有限公司的投资交割，并携手合肥高投推动意优科技在合肥落地子公司，建设人形机器人模组研发生产中心；金额未披露。报道称意优科技为智元机器人、卓益得机器人等人形机器人企业的关节定点供应商。
