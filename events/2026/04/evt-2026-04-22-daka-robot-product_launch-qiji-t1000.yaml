title:
  zh: 大咖机器人在北京鸟巢发布骐骥 T1000 吨级重载「机器马」
summary:
  zh: 4 月 22 日，大咖机器人（Dax Robotics）在北京朝阳鸟巢举行新品发布会，全球首发骐骥 T1000 吨级重载「机器马」：搭载全自研关节，扭矩超 2000N·m，整备负重能力 1000 公斤，配备超高压系统，续航 1 至 2 天，面向安防巡检、消防救援、工程基建、智能物流、民生养老、户外出行等场景。文中称公司已与顺丰、科捷等物流企业达成合作。
