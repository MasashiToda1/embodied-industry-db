title:
  zh: 面壁智能完成数亿元融资，深创投、汇川产投联合领投
summary:
  zh: 科创板日报 4 月 9 日报道，面壁智能近日宣布完成新一轮数亿元人民币融资，由深创投、汇川技术旗下汇川产投联合领投，道禾长期投资、国泰海通创新投、武岳峰科创等跟投。报道称这是公司 2026 年完成的第二笔融资，一季度累计融资规模超 10 亿元。
counterparties:
- 深创投
- 汇川产投
