title:
  zh: 零次方机器人完成超亿元融资，润泽集团领投
summary:
  zh: 2026 年 4 月，零次方机器人（Zerith）宣布完成最新一轮超亿元人民币融资，由润泽集团领投，宁波东力、接力天使、平湖泽新跟投。官方称本轮与润泽集团基于「算力 + 场景」逻辑合作，并锁定机器人领域订单战略合作；资金投向场景基础模型算法、本体量产降本与渠道拓展。
