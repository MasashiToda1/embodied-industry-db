  zh: 4 月 2 日，星海图宣布完成 20 亿元 B+ 轮融资，投资方包括华登科技、蓝思科技、矽芯投资、时代伯乐、航发基金、修远资本、弘章投资、御海资本、金融街资本、金浦投资、北京科创、国元股权、中金资本旗下基金、普华资本、洪泰基金、广发乾和等。报道称本轮距上轮融资 1 个月，估值突破 200 亿元。另有媒体报道称本轮金额为「近 20 亿元」。
