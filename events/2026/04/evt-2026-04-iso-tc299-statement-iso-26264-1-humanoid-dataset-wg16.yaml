title:
  zh: ISO/TC 299 立项人形机器人数据集国际标准 ISO 26264-1，成立 WG16 工作组
summary:
  zh: 2026 年 4 月报道，由北京机械工业自动化研究所牵头的人形机器人数据集国际标准 ISO 26264-1 在 ISO/TC 299 立项，并成立人形机器人数据集工作组 ISO/TC 299/WG16，由中方专家任召集人。这是中国首次在 ISO/TC 299 成立国际标准工作组。
