title:
  zh: 星动纪元完成超 2 亿美元新一轮融资，顺丰集团领投
summary:
  zh: 4 月 27 日，星动纪元宣布完成超 2 亿美元新一轮融资，由顺丰集团领投，红杉中国、IDG 资本、中金资本、京铭资本等联合注资，科捷智能、东风产投、工银资本、联通旗下基金等产业方参与，老股东清控天诚、鸿瑞达增持。公司称已与中国邮政、顺丰集团等合作落地 10 余个物流中心，并在 2026 年第二季度开启千台级机器人批量交付。
