title:
  zh: 众擎机器人完成 2 亿美元 B 轮融资，估值突破百亿元
summary:
  zh: 2026 年 4 月 10 日报道，近日众擎机器人完成总额 2 亿美元的 B 轮融资，融资后估值突破百亿元人民币。本轮由河南投资集团汇融基金再度领投，立讯精密联合领投，中创智领战投、基石资本、龙岗金控、金谷资本、财通资本、多伦科技战投等参与，黄浦江资本、星航资本等老股东跟投。
