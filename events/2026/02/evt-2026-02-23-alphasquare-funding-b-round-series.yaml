title:
  zh: 智平方宣布完成超 10 亿元 B 轮系列融资，估值超百亿元
summary:
  zh: 2 月 23 日，智平方（AI² Robotics）宣布完成 B 轮系列融资，融资规模超 10 亿元人民币，公司估值超过百亿元。官方称此前 2025 年半年内连续完成 7 轮数亿级融资，此次再获 5 轮加注，一年累计完成 12 轮融资。财新报道投资方包括百度、中国中车、沄柏资本、国泰海通等。
