summary:
  zh: 2 月 10 日，阿里巴巴达摩院发布具身智能大脑基础模型 RynnBrain，一次性开源包括 30B MoE 在内的 7 个全系列模型，并开源评测基准 RynnBrain-Bench。达摩院称该模型基于 Qwen3-VL 训练，引入时空记忆与物理世界推理，在 16 项具身开源评测榜单上刷新纪录。
