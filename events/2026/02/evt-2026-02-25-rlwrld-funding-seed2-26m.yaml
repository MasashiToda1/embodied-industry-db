title:
  zh: RLWRLD 完成约 2600 万美元 Seed 2 轮融资，Headline Asia 与 Z Venture Capital 领投，累计种子融资约 4100 万美元
summary:
  zh: 2 月 25 日，RLWRLD 发布新闻稿称已完成 Seed 2 轮融资，本轮募资「约 2600 万美元」，此前 Seed 1 轮为 1500 万美元，累计种子投资约 4100 万美元。财务投资方为 Headline Asia 与 LY Corporation 旗下 Z Venture Capital；战略投资方包括 CJ Logistics、Kakao Investment、Lotte Ventures、Hanwha Asset Management、Mirae Asset – Emart Investment Fund I、Hyosung Ventures、Smilegate Investment 与 T Investment，Seed 1 领投方 Hashed Ventures 跟投。公司称计划 2026 年上半年正式发布机器人基础模型。
