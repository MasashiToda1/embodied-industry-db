title:
  zh: 原力灵机发布具身原生大模型 DM0、开发框架 Dexbotic 2.0 与量产工作流 DFOL
summary:
  zh: 2 月 10 日，原力灵机在北京举办技术开放日，发布具身原生大模型 DM0、开发框架 Dexbotic 2.0 和应用量产工作流 DFOL。官方称 DM0 参数量 2.4B，从零开始训练并与阶跃星辰联合训练，预训练覆盖 UR、Franka、ARX、UMI、Aloha、R1-Lite、Realman、DOS-W1 等 8 种机型，并宣布 DM0 全面开源。
