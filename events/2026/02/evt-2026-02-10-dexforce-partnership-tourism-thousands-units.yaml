title:
  zh: 跨维智能签署三项文旅战略合作，与盈新数科约定三年内落地不少于 1000 台机器人
summary:
  zh: 跨维智能接连与桂林旅游学院、盈新发展子公司深圳盈新数科具身智能有限公司、上海景域无疆（驴妈妈）签署战略合作，计划三年内为文旅场景落地数千台人形机器人。其中与盈新数科明确三年内落地不少于 1000 台，部署于奶茶、咖啡、调酒、爆米花、冰激淋、24 小时零售店等文旅景区、游乐场、酒店与智慧物业场景。
