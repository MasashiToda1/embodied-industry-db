title:
  zh: 小鹏布局人形机器人全链条量产基地
summary:
  zh: 2 月 25 日，广州市高质量发展大会上，小鹏人形机器人全链条量产基地作为天河区重点「开门红」项目正式提报。基地将落地广棠科创城具身智能产业园，园区总建筑面积约 11 万平方米，一期建设机器人厂房、动力站房及配套设施。
