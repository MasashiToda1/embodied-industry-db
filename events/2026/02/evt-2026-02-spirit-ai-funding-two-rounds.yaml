title:
  zh: 千寻智能连续完成两轮融资近 20 亿元，云锋基金、红杉中国等参与
summary:
  zh: 2026 年 2 月，千寻智能宣布连续完成两轮融资近 20 亿元人民币，投资方包括云锋基金、混沌投资、红杉中国、Synstellation Capital、TCL 创投、明荟致远、重庆产业投资母基金、杭州金投、360 基金、厚雪资本等，顺为资本、Prosperity7、达晨财智等老股东继续认购。36 氪报道称本轮后公司估值突破百亿元。
