title:
  zh: 卓益得机器人完成近亿元 Pre-A+ 轮融资
summary:
  zh: 2026 年 2 月 4 日，上海卓益得机器人有限公司宣布完成近亿元人民币 Pre-A+ 轮融资，由上海浦东引领区投资中心、上海张江科技创业投资有限公司联合领投，河南省科投产业发展投资基金等跟投，并引入青岛征和工业股份有限公司、厦门松霖科技股份有限公司集团成员作为战略产业投资者。资金用于核心技术与产品迭代、量产交付与供应链体系升级，重点面向老年人康养陪护市场。
counterparties:
- 上海浦东引领区投资中心
