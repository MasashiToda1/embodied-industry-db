  zh: 万机易租完成首轮天使轮融资，三位企业家联合战略投资
summary:
  zh: 2026 年 2 月，万机易租宣布完成首轮天使轮融资，由三位细分赛道头部企业家联合战略投资，金额未披露。资金用于城市网络扩张、AI 匹配与数字化运维平台升级、供应链绑定与团队扩张。公司称平台已覆盖全国 30 个核心城市、超 300 家服务商，全品类机器人租金从 100 元至数千元，并与捞王、卡通尼乐园达成合作。
