title:
  zh: 越疆开启第三批全尺寸工业人形机器人 ATOM 量产交付
summary:
  zh: 2 月 4 日，深圳新闻网报道越疆科技已开启第三批全尺寸工业人形机器人 ATOM 的 2026 年量产交付，并分批投入产业一线应用。ATOM 搭载越疆自研 DOBOT-VLA 模型，将抽象指令转化为结构化任务链并输出动作轨迹；此前越疆机器人已在深圳电影院全自主上岗。
