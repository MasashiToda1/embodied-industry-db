summary:
  zh: 2 月 6 日，动易科技在广州海珠创意产业园的发布会上宣布具身智能体 PHYBOT C2 量产，并发布 AI 智能体 PhyCore 0.1，宣布其基础运动能力面向全球永久免费开源、作为所有动易机器人出厂标配。C2 身高 1.35 米、体重 35kg，双臂负载 5kg，移动速度 4m/s，头部搭载双目 RGB 传感器与投影模块。
