title:
  zh: Toyota Motor Manufacturing Canada 与 Agility 签 RaaS 商业协议，试点后部署 Digit
summary:
  zh: 2 月 19 日，Agility Robotics 宣布 Toyota Motor Manufacturing Canada（TMMC）在试点成功后与其签署 Robots-as-a-Service 商业协议，将在其工厂部署 Digit 支持制造、供应链与物流作业。TMMC 总裁 Tim Hollander 称在评估多款机器人后选择部署 Digit。
