title:
  zh: ATI 推出面向人形机器人的六轴力 / 力矩传感器 Varo 系列（Varo55 / Varo62）
summary:
  zh: ATI Industrial Automation（Novanta 旗下）在官方 LinkedIn 发布帖子「A New Sense of Touch for Humanoid Robotics」，推出面向人形机器人、移动机械臂与 OEM 机器人平台的高性能力 / 力矩传感器 Varo，称其为标定六轴传感、紧凑轻量、全数字设计。Novanta 官网 Varo 系列页面列出 Varo55（直径 55mm、高 13.1mm、重 0.115kg，额定 Fx / Fy ±1200N）与 Varo62（直径 62mm、高 18.3mm、重 0.22kg，额定 Fx / Fy ±3000N、Tx / Ty ±120Nm）两款，数字输出、标准化数字接口（RS422）。
