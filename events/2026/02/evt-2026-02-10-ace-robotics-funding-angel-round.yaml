title:
  zh: 大晓机器人完成天使轮融资，蚂蚁集团领投
summary:
  zh: 2 月 10 日消息，大晓机器人于近期完成天使轮融资，由蚂蚁集团领投，启明创投、金景资本、弘毅投资、联想创投、上海交大母基金菡源资产等跟投，老股东商汤国香资本持续增资，金额未披露。资金用于 ACE 具身研发范式迭代、环境式数据采集与开悟世界模型 3.0 研发，推动具身超级大脑模组落地。
