title:
  zh: 现代汽车集团战略投资 FieldAI，双方合作把物理 AI 扩展到建筑与工业现场
summary:
  zh: 2026 年 2 月，韩国媒体 The Asia Business Daily 与 Aju Press 报道，现代汽车集团向美国机器人软件公司 FieldAI 投资数百万美元；报道引用 FieldAI 在 LinkedIn 发布的声明，称已与现代汽车集团建立正式合作，「该合作包含财务投资，聚焦把物理 AI 扩展为建筑与工业现场的完整运营 AI」。Aju Press 称 FieldAI 的 Field Foundation Model 已装在 Boston Dynamics 的 Spot 上，用于亚洲、欧洲和北美的建筑工地。两篇报道均未给出确定金额。
counterparties:
- Hyundai Motor Group
