title:
  zh: 柯力传感及旗下产业基金数千万元战略投资消费级具身智能机器人公司恒之未来
summary:
  zh: 柯力传感及其与时代伯乐、宁波市江北区国资共同组建的宁波传感谷创业投资基金完成对恒之未来（重庆）创新科技有限公司的数千万元投资。恒之未来成立于 2022 年 7 月，产品为 1.1kg、14 自由度的智能机器狗「哮天 Sirius」。双方称将围绕机器人执行器底层技术、运动控制与力觉 / 视觉 / 触觉感知融合展开合作。
