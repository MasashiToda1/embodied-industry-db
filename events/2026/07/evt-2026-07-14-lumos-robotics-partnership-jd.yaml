title:
  zh: 鹿明机器人与京东签署战略合作，目标三年内京东平台累计销售额突破 10 亿元
summary:
  zh: 鹿明机器人与京东签署战略合作协议，以产品共创、技术协同、场景拓展、渠道共建为核心，未来三年共同投入产品、供应链及生态资源，目标实现鹿明全系列产品在京东平台累计销售额突破 10 亿元；双方围绕 JoyInside、JoyAI 等能力协同研发，并联合打造面向工业制造、数据采集、智慧巡检的一体化方案。
