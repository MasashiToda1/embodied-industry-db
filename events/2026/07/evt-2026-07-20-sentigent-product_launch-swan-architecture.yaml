title:
  zh: 深庭纪发布户外伴随机器人具身智能架构 SWAN
summary:
  zh: 7 月 20 日，深庭纪发布户外伴随机器人专属具身智能架构 SWAN，部署于端侧实时运行，由模型推理主链、混合记忆身份数据库、安全数据飞轮系统三大模块组成，支持跟随、守护、自主表达与意图响应。SWAN 将率先落地 Rovar 机器人，公司称产品计划年底上市，并已完成 Pre-A 轮融资。
