summary:
  zh: 7 月 9 日，珞石机器人正式登陆港交所。公告显示，本次全球发售 2303.19 万股 H 股，发售价每股 38 港元；香港公开发售获 156.58 倍超额认购，国际发售获 11.96 倍超额认购，引入广发基金、华泰资本、北京金融街资本等 5 名基石投资者。
