title:
  zh: 特斯拉称已拆除弗里蒙特 Model S / X 产线并在安装第一代 Optimus 产线，首批机器人用于内部 Optimus Academy
summary:
  zh: 7 月 22 日，特斯拉在 2026 年第二季度股东信中称，已拆除弗里蒙特工厂 Model S 和 X 的生产线，正在安装第一代 Optimus 产线，「即将开始生产」；首批 Optimus 将用于公司内部的 Optimus Academy，做训练数据采集和功能开发，而非交付客户。股东信同时称 Giga Texas 的 Optimus 厂房建设全面展开。
