title:
  zh: Rainbow Robotics 向丰田累计供应约 25 台 RB-Y1，较 2024 年首批 5—6 台扩大约五倍
summary:
  zh: 据韩国电子新闻 7 月 6 日援引业界消息报道，Rainbow Robotics 自 2024 年向丰田首批交付移动双臂机器人 RB-Y1 以来持续扩大供货，丰田累计采购 RB-Y1 约 25 台；2024 年首批约 5—6 台，两年内供货规模扩大约五倍。
