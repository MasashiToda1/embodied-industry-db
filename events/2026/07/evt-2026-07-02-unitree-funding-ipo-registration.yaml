title:
  zh: 证监会同意宇树科技科创板 IPO 注册
summary:
  zh: 7 月 2 日，证监会官网发布《关于同意宇树科技股份有限公司首次公开发行股票注册的批复》，批复自同意注册之日起 12 个月内有效。本次 IPO 融资金额为 42.02 亿元，保荐机构为中信证券。上交所信息显示，该项目 3 月 20 日获受理，6 月 1 日经上市委会议审议通过，6 月 2 日提交注册。
