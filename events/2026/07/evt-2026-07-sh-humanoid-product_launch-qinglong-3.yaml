  zh: 国地中心在 WAIC 2026 展出「青龙 3.0」，配千寻位置联合研发的时空算力背包
summary:
  zh: 国地中心在 WAIC 2026 展台展出新一代全尺寸开源公版人形机器人「青龙 3.0」，报道称其采用高性能一体化关节，并背负与千寻位置联合打造的「时空算力背包」，可在端侧运行多类模型并实现端边协同，面向物流配送、园区导航、自主巡检等场景。
