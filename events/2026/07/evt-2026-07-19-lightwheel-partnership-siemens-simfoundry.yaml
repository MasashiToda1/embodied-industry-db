title:
  zh: 光轮智能与西门子达成合作，基于 SimFoundry 打通工业仿真与具身仿真
summary:
  zh: 7 月 19 日，WAIC 2026 现场，光轮智能与西门子正式达成合作。双方以光轮智能「求解—测量—生成」三位一体自研仿真平台 SimFoundry 为核心，将西门子工业设计与仿真分析中的材料属性、摩擦参数、形变规律、装配公差和工艺约束等工程信息转化为带物理属性的 SimReady 仿真资产与交互环境，并延伸到 RoboFinals 工业级评测与 RoboStack 部署平台；重点方向为高精度工业具身仿真、工业级具身评测和真实部署反馈。
