summary:
  zh: 7 月 17 日至 20 日，智身科技在 2026 世界人工智能大会（WAIC 2026）首次以完整产品矩阵亮相，展出四足机器人钢镚 L2、防爆四足机器人铅球 SP1、人形机器人银毅 NE01 与 MATRiX 2.0 仿真训练平台。公司同时披露截至 2026 年 6 月累计量产突破 15000 台。
