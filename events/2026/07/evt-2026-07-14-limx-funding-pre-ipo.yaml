title:
  zh: 逐际动力完成近 2 亿美元 Pre-IPO 轮融资，半年累计融资 4 亿美元
summary:
  zh: 官网 7 月 14 日发文称，逐际动力近日完成 Pre-IPO 轮融资，金额近 2 亿美元，过去半年累计融资 4 亿美元。投资方包括 IDG 资本、蓝思科技、GGG Group、Redstone VC、华山资本、合肥滨湖产发集团；磊石资本（Stone Venture）连续追投，绿洲资本、基石资本、南山战新投、尚颀资本、蔚来资本等老股东加注。资金用于大小脑融合技术产品化、数千台人形机器人规模化部署与全球市场拓展。
