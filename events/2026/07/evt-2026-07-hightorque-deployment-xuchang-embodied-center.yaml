title:
  zh: 高擎动力参与共建河南省高职首个具身智能创新中心，捐赠课程体系与 Mini Pi 系列人形机器人开发平台
summary:
  zh: 高擎动力官网 7 月 11 日发文称，河南省首个高职院校具身智能创新中心政校企共建签约暨揭牌仪式在许昌职业技术学院举行，高擎作为具身智能机器人训练场设备和技术共建单位出席，向创新中心捐赠具身智能全阶段课程体系与基于 Mini Pi 系列的标准化人形机器人开发平台。文中称三家合作单位累计捐赠价值三百余万元的算力、设备与课程产教资源。
