title:
  zh: 国地中心联合华为发布具身智能实训场样板点并揭牌启用
summary:
  zh: 7 月 20 日，在 WAIC 2026「人形机器人与具身智能创新发展论坛」上，国家地方共建人形机器人创新中心与华为共同为「具身智能实训场样板点」揭牌。华为提供算力、存力、网络及 CloudRobo 具身智能仿训平台，国地中心提供本体、数据、模型、测评与部署方案；华为页面称搭载联创成果的「灵龙」系列机器人已进驻延锋完成实景数据采集与自主作业验证。
