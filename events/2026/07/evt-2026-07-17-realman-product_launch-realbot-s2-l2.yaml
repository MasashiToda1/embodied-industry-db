summary:
  zh: 7 月 17 日，2026 世界人工智能大会期间，睿尔曼智能全球首发 RealBot-S2 与 RealBot-L2 两款轮式人形机器人，分别从「折叠」与「升降」两个维度扩展作业空间。两款产品共用全栈自研关节模组、GLN 远程作业网络与真实场景数据闭环；现场由北京人形机器人数据训练中心的操作员远程操控上海展台机器人完成泡茶作业。
