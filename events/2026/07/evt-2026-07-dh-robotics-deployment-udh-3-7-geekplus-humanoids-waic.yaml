title:
  zh: 大寰机器人 UDH-3-7 三指灵巧手搭载于 7 台极智嘉通用人形机器人，在 WAIC 2026 完成仓储物流料框搬运与异形物品分拣
summary:
  zh: 大寰机器人发文称，WAIC 2026 期间其 UDH-3-7 三指灵巧手搭载于 7 台极智嘉通用人形机器人，完成仓储物流场景下的料框搬运、多类型异形物品（香蕉、毛绒玩偶、毛巾、袋装面包、袋装薯片等）分拣任务，并出现在央视新闻报道中。文中称 UDH-3-7 整手重 900g，7 个自由度，指尖力 50N，最大提拉负载 15kg，大拇指支持 0—180° 平行侧摆。2026 世界机器人大会展商产品页称 UDH-3-7-50 基于柔性可反驱微型直驱关节模组构建，指尖重复定位精度 ±0.02mm。
