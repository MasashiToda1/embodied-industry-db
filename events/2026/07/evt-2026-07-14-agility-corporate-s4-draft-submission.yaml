title:
  zh: Agility 与 Churchill XI 向 SEC 秘密提交 Form S-4 注册声明草案
summary:
  zh: 7 月 14 日，Agility Robotics 与 Churchill Capital Corp XI 宣布已向美国 SEC 秘密提交 Form S-4 注册声明草案，推进此前公告的业务合并。公告重申交易总募资超 6.2 亿美元（信托账户 4.21 亿美元现金加约 2.01 亿美元 PIPE），合并后公司以「AGLT」代码上市。
