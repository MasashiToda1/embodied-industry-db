title:
  zh: Hugging Face 桌面机器人 Reachy Mini 公开售价上调：Lite 版 399 美元、无线版 499 美元（不含税与运费），交付周期约 90 天
summary:
  zh: Hugging Face 官方博客 Reachy Mini 页面列出当前售价：Reachy Mini Lite（需连接 Mac / Linux 电脑，有线供电）399 美元，Reachy Mini 无线版（内置 Raspberry Pi 4、Wi-Fi、电池、加速度计）499 美元，均不含税与运费，交付约 90 天；所有订单按 DAP 发货，运费与进口关税由买方承担，10 台以上联系 Pollen Robotics 销售。该页面 2026 年 7 月 3 日合并的更新将 Lite 从 299 美元改为 399 美元、无线版从 449 美元改为 499 美元，并把下单链接从 Stripe 换到 Shopify 商店。
