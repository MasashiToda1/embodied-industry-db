title:
  zh: 月泉仿生在 WAIC 2026 展出 Y-Hand M2 38 自由度灵巧手、X-Hand M1 与博文 W-Bot 2.0 轮式人形
summary:
  zh: 36 氪报道，月泉仿生在 WAIC 2026 展出四大产品线：应手 Y-Hand M1 灵巧手掌部重 299.7g、26 自由度、五指抓握力 200N（7 月初发布），Y-Hand M2 具备 38 个自由度；信手 X-Hand M1 为面向工业场景的刚性灵巧手，最大负重 50kg；YQ Motors 系列电机覆盖 4–22mm 七个系列；轮式人形整机博文 W-Bot 2.0 底盘 0.238㎡，工作空间覆盖离地 0–2.2m。
