title:
  zh: Humanoid 完成 1.52 亿美元 A 轮融资，投后估值 13.5 亿美元，Prime Movers Lab 领投，舍弗勒与博世参投
summary:
  zh: 7 月 21 日，英国 Humanoid 宣布完成 1.52 亿美元 A 轮融资，投后估值 13.5 亿美元，累计融资达 2.7 亿美元。本轮由 Prime Movers Lab 领投，Schaeffler、Bosch、Fubon Financial Holding Venture Capital 与 Aglaé Ventures 参投。公司称资金用于加速商业部署与 KinetIQ AI 平台演进；公司 2024 年成立，团队逾 250 人，在伦敦、波士顿、温哥华与圣迭戈设办公室。
