title:
  zh: 启元新创（上海）落户浦东张江机器人谷，列为上海市人工智能重点项目
summary:
  zh: 证券时报 7 月 26 日报道，上纬新材旗下子公司启元新创（上海）科技有限公司近日正式落户浦东，作为上海市人工智能重点项目签约，项目同步落地张江机器人谷。报道称 2026 年一季度上纬新材具身智能业务研发投入 3778 万元，启元线下体验店已在上海、深圳、西安、厦门、广州陆续启动。
