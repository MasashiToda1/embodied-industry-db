title:
  zh: 首批「河南造」众擎 T800 在郑州云智基地下线
summary:
  zh: 7 月 24 日，首批「河南造」众擎 T800 人形机器人在郑州高新区的众擎智能制造（郑州云智）基地下线，将陆续发往中国、北美、欧洲及东南亚市场。基地一期建筑面积约 8000 平方米。河南投资集团联合郑州产投、郑州高新产投、洛阳工控集团战略投资众擎机器人。
