title:
  zh: 中科慧灵与蓝思科技、湖南华夏投资集团合资成立灵巧手公司「中科慧思」
summary:
  zh: 2026 年 7 月，中科慧思具身智能（湖南）有限公司成立，由北京中科慧灵机器人技术有限公司、蓝思科技股份有限公司与湖南华夏投资集团有限公司共同设立，专注灵巧手及具身操作能力。8 月 7 日该公司在长沙发布 L1、D1、M1 三款灵巧手，L 系列已用于 CASBOT BAND 机器人乐队演奏。
