title:
  zh: 小米推出具身基座模型 Xiaomi-Robotics-1
summary:
  zh: 7 月 16 日，小米集团正式推出具身基座模型 Xiaomi-Robotics-1。该模型采用「预训练 + 后训练」两阶段训练范式，预训练使用 10 万小时真实世界操作轨迹数据，后训练构建约 1 万小时跨本体数据，模型参数规模最高 10B，可按自然语言指令执行多类任务。
