title:
  zh: 上海市人形机器人中试服务平台投入运营，国地中心与卓益得签千台套试制专项
summary:
  zh: WAIC 2026 期间，国地中心联合上海电气集团打造的上海市人形机器人中试服务平台正式发布并投入运营，平台落地张江机器人谷，设两条模块化柔性整机试制产线与一条精密零部件装配线，报道称具备年产 2000 台（套）试制能力。同日国地中心与卓益得完成千台套人形机器人试制专项签约。
