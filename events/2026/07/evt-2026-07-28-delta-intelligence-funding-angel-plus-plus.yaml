title:
  zh: 德塔智能完成近 5 亿元天使++ 轮融资
summary:
  zh: 新京报 7 月 28 日报道，人形机器人基础模型公司德塔智能近日完成近 5 亿元天使++ 轮融资，投资方包括多家上市公司产业方和头部财务投资机构，为公司成立半年内的第六轮融资。此前投资方包括智元机器人、乐聚机器人、星海图等主机厂，以及元禾控股、复星锐正、华映资本、联想创投等机构。
