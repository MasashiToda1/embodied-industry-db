title:
  zh: RoboParty 萝博派对连续完成近 5 亿元天使++轮和 Pre-A 轮融资，Pre-A 轮由宁德时代独家投资
summary:
  zh: 7 月 15 日消息，开源具身全栈平台「RoboParty 萝博派对」近日连续完成近 5 亿元人民币天使++轮和 Pre-A 轮融资：天使++轮由顺为资本、经纬创投、小米战投、商汤国香等老股东持续加注，Pre-A 轮由宁德时代独家投资，光源资本担任孵化方和独家财务顾问。报道称公司已完成从关节模组、整机平台、运动控制、SDK 到开源开发体系的底层建设，正在进入量产爬坡阶段，并于 2026 年 1 月成立 RoboParty Lab。
