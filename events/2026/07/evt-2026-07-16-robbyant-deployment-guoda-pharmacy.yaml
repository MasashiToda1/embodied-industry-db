title:
  zh: 蚂蚁灵波与国大药房的「机器人智慧药房」在上海门店投入运营，入选 WAIC 2026 镇馆之宝
summary:
  zh: 中国日报网 7 月 16 日报道，蚂蚁灵波与国大药房打造的「机器人智慧药房」已在国大药房上海门店投入实际运营，由具身基座模型 LingBot-VLA 2.0 驱动乐聚、星海图和蚂蚁灵波自研 R-2 三种机器人协同完成接单、分拣与交付，门店无需空间改造。该方案入选 WAIC 2026 十大「镇馆之宝」。官方称 LingBot-VLA 2.0 预训练融入 6 万小时真实数据，已适配 17 家厂商 20 余种机器人构型。
