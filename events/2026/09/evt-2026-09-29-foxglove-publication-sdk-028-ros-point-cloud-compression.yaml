title:
  zh: Foxglove SDK 0.28.0 与 ROS Bridge 3.6.0 更新远程点云压缩能力
summary:
  zh: Foxglove 发布 SDK 0.28.0，为 ROS 1 PointCloud2 通道自动应用 Draco 压缩，并开放保持点顺序的编码选项；ROS
    Bridge 3.6.0 增加 point_cloud_compression_method 参数。发布还扩展音频格式标识并修复远程访问连接问题。10 月
    2 日 ROS 1 Bridge 3.5.0 将 SDK 升至 0.28.0，作为兼容更新附记，不另计一次功能发布。
