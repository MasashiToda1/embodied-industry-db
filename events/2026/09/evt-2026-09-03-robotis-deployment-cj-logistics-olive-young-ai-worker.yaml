title:
  zh: CJ 大韩通运在 Olive Young 龙仁物流中心包装线上线两台 ROBOTIS 双臂人形机器人，模型由 RLWRLD 提供
summary:
  zh: 9 月 3 日，CJ 大韩通运宣布在京畿道龙仁市杨智 Olive Young 物流中心部署两台双臂人形机器人，用于包装工序中向纸箱内放入缓冲材料，公司称这是韩国首次在实际运营的物流流程中使用人形机器人。此前 2025 年在军浦履约中心完成现场测试。硬件由 ROBOTIS 提供，机器人手由 Aidin Robotics 提供，机器人基础模型（RFM）由 RealWorld AI（RLWRLD）提供。
