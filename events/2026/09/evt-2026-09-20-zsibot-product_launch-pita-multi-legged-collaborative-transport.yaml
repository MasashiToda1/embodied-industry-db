title:
  zh: 智身科技旗下 PITA 发布「多足联运」多机器人协同搬运系统
summary:
  zh: 智身科技旗下通用智能模型品牌 PITA（Physics InTeraction AI）发布「多足联运」（Multi-Legged Collaborative Transport）系统：多台钢镚 L1-W EDU 四足机器人在无预先建图、无 GPS 的环境中共同承载同一物体并自主完成运输，操作者通过 VR 指定目标位置。官方稿称 PITA 于 2026 年推出，核心产品含通用机器人模型、可微物理引擎、视频世界模型与跨本体算力终端。
