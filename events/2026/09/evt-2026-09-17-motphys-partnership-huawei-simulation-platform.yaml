title:
  zh: 莫特菲斯与华为联合发布具身智能仿真基座方案
summary:
  zh: 媒体报道莫特菲斯在华为全联接大会首日与华为联合发布具身智能仿真基座解决方案，以 MotrixSim 与 MotrixLab 连接仿真、强化学习训练和真机部署，方案纳入华为生态伙伴体系。报道同时披露鲲鹏及昇腾适配；未披露客户采购数量或合同金额。本条不将同稿转载视为独立验证，也不采用未核实测试条件的性能增幅。
