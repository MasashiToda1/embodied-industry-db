title:
  zh: 德塔智能与长安天枢智能机器人签署战略合作备忘录，面向汽车制造场景
summary:
  zh: 北京德塔源创智能科技有限公司与长安天枢智能机器人公司签署战略合作备忘录（MOU），面向汽车制造工业场景打通「场景需求—数据采集—模型训练端侧部署—真机验证—数据回流—持续优化」研发闭环，推进人形机器人在汽车总装、物流转运、现场巡检、装配作业、上下料、质量检验等场景的 PoC 验证与示范应用。
