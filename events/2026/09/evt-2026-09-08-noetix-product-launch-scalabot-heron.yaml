summary:
  zh: 9 月 8 日，松延动力发布通用具身智能技术品牌 Scalabot，并推出其技术架构 HERON 下的首个世界模型 HERON-World Model。公司称模型支持不同构型、不同自由度的机器人，将率先应用于家庭服务场景，并计划先以几百台机器人进入家庭采集数据。
