title:
  zh: 天工机器人推出木马速运一体机（3D Sorter E），已在头部快递企业仓库投入运营
summary:
  zh: 2026 年 9 月，天工机器人推出木马速运一体机（3D Sorter E），作为交叉带分拣体系的补充，用一柱多车、立体化格口设计让 NC 件与扁平件多流向分拣在一套设备内一次完成。报道称该设备已在国内某头部快递企业仓库投入运营，2026 年 7 月 2 日现场峰值处理量 24500 件/小时，人员分拣效率提升 280%。客户名称未披露。
