title:
  zh: 本末动力（06731.HK）启动港股 IPO 全球发售，发售 5000 万股 H 股、每股 21.6 港元，9 月 29 日挂牌
summary:
  zh: 9 月 21 日，本末动力（北京）科技股份有限公司（Direct Drive Tech Limited，股份代号 06731）刊发招股书并启动香港联交所主板全球发售：发售 5000 万股 H 股，其中香港公开发售 250 万股、国际发售 4750 万股，发售价每股 21.6 港元，中信证券（香港）为独家保荐人，招股书列明的挂牌日期为 2026 年 9 月 29 日。基石投资者香港科创与 JSC International 合计认购约 4.72 亿港元。假设超额配股权未获行使，公司估计所得款项净额约 9.825 亿港元。
counterparties:
- 中信证券（香港）
- 香港科创
- JSC International Investment Fund SPC – Shenghai SP
