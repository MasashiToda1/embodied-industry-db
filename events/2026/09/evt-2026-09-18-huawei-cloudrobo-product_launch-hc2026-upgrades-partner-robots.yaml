title:
  zh: 华为云 CloudRobo 在全联接大会 2026 发布平台能力升级，并与福龙马、亿嘉和发布环卫与电力作业机器人
summary:
  zh: 9 月 18 日，华为全联接大会 2026 期间，华为云 CloudRobo 具身智能论坛在上海举办，发布 CloudRobo 平台在模型、数据、仿真、协同架构、运行管理与生态合作方面的能力升级，并联合福龙马发布无人清扫机器人 SD22C、联合亿嘉和发布配网带电作业机器人 Z200Pro，同时与九家伙伴发布覆盖工业制造、能源电力、市政环卫、教育教学、工程装备等场景的八大具身智能行业解决方案。
