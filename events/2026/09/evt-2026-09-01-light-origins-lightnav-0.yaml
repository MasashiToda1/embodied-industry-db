summary:
  zh: 官方稿称使用 2000 多个真实室内外场景、以 Real2Sim2Real 合成 4000 多小时后训练数据，在公开视觉语言导航评测基准上报告
    SOTA，并称可在不使用目标机器人、目标环境或特定任务训练数据的情况下零样本泛化。模型已发布在 Hugging Face。
  en: Official post states 4000+ hours of post-training data synthesized via Real2Sim2Real
    from 2000+ real indoor and outdoor scenes, reports SOTA on public VLN benchmarks,
    and claims zero-shot transfer without target-robot, target-environment or task-specific
    training data. Model published on Hugging Face.
