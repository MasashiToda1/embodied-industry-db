summary:
  zh: 跨维智能等机构联合提出 TaskAnchor，在反应式VLA中注入执行历史相关的视觉特征与任务阶段信息，以处理相似观察下不同任务状态对应不同动作的问题；方法不增加独立规划器或改变动作生成机制。论文报告
