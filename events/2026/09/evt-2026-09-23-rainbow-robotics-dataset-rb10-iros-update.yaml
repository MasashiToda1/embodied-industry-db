  "summary": {
    "zh": "Hugging Face 的 rb10_iros_double_0923 元数据记录 333 条轨迹、282633 帧、1 个任务及 30 FPS，采用 LeRobot v3.0 格式。已收录的 rb10_iros_double 版本为 197 条轨迹、171789 帧；本次只记录新版规模变化，不把旧版、trim 和 0921 加工版本重复计为新数据集。未标注许可，不认定可自由商用；轨迹数差值不解释为全部新增采集。"
  },
