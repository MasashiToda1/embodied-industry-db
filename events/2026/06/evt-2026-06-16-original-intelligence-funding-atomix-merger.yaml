title:
  zh: 原力灵机完成与原力聚合（Atomix）合并，同步完成新一轮战略融资
summary:
  zh: 6 月 16 日，原力聚合（Atomix）官网宣布原力灵机完成与原力聚合的合并，并完成新一轮战略融资。投资方包括智谱、阶跃星辰、商汤、阿里巴巴，华勤技术、上汽恒旭等产业资本，以及金浦资本、元禾璞华、兴证资本、苏州基金、招银国际、厚雪基金、正奇能科、运衡实业等机构，老股东跟投，高鹄资本担任独家财务顾问。融资金额未披露。
