title:
  zh: 无界动力宣布完成超 2 亿美元天使轮融资，京东关联基金等参投
summary:
  zh: 6 月 26 日，无界动力宣布完成超 2 亿美元天使轮融资，由京东关联基金、C 资本、弘毅投资、盛宇投资等联合投资，老股东线性资本、红杉中国、华业天成、雅瑞资本等跟投，近 2 亿美元 Pre-A 轮融资接近收官。公司称已签署总额近 1 亿美元的全球订单，其中与远景科技集团签署超 5 亿元海外部署合作，并与 ZF LIFETEC、欧摩威集团达成战略合作；第二代机器人 K15 已开启批量投产。
