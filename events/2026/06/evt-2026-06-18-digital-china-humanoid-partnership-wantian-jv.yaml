title:
  zh: 数字华夏与港股中国万天控股旗下公司签约，共建合资运营平台推动服务人形机器人落地
summary:
  zh: 6 月 18 日，数字华夏（深圳）机器人有限公司与中国万天控股（1854.HK）关联控股子公司深圳万天人工智能科技有限公司签署战略合作框架协议，双方共建合资运营平台，推动服务人形机器人批量落地政务、金融、康养、商业场景，并围绕「出货、出海、出圈」布局东盟、中东、欧美市场。
counterparties:
- 中国万天控股有限公司
- 深圳万天人工智能科技有限公司
