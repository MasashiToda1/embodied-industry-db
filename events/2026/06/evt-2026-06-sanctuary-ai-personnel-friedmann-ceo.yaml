  zh: Sanctuary AI 董事会任命 Daniel Friedmann 为 CEO，临时 CEO James Wells 离任
summary:
  zh: 2026 年 6 月，Sanctuary AI 董事会任命原董事长 Daniel Friedmann 为首席执行官，Friedmann 曾任航天公司 MDA CEO 近二十年、Carbon Engineering CEO 兼董事长；董事会同时向离任的 James Wells 致谢。BetaKit 报道称 Wells 于 2024 年 11 月联合创始人 Geordie Rose 被免职后以临时 CEO 身份接任，此次离任伴随公司「新战略」。
