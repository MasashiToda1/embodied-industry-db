title:
  zh: 傲意科技发布与迈来芯联合打造的 ROH-AP003 触觉力控灵巧手
summary:
  zh: 2026 张江具身智能供应链大会（6 月 16 日至 17 日）期间，傲意科技发布与迈来芯联合打造的 ROH-AP003 触觉力控灵巧手，采用迈来芯 Tactaxis 3D 磁触觉传感技术，传感器可感知 0.1N 的力，剪切力方向分辨度 1°，采样频率 150Hz。公司称其为国内首个实现量产的 3D 磁触觉灵巧手，可搭载于机械臂与人形机器人平台。
