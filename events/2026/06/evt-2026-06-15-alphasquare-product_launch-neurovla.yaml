summary:
  zh: 6 月 15 日，智平方创始人兼 CEO 郭彦东在 2026 北京智源大会具身产业 CEO 论坛发布类脑式具身智能系统 NeuroVLA，并宣布在 AlphaBrain Platform 开源。官方称该架构由智平方联合香港科技大学（广州）研发，仿生「皮层-小脑-脊髓」三层结构，分别承担任务规划、动作稳定与本能级快速反应。
