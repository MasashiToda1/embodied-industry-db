title:
  zh: 极佳视界完成 10 亿元 B2 轮融资，狮城资本领投
summary:
  zh: 网易科技 6 月 15 日报道，极佳视界近日完成 10 亿元 B2 轮融资，由狮城资本领投，中比基金、建投投资、万向钱潮、复星锐正、华盖创赢、金创投、德屹资本、华仓资本、元石基金等跟投，老股东国中资本、达晨财智、图灵资管追加投资。2026 年 3 月至 6 月三轮累计融资 35 亿元。
