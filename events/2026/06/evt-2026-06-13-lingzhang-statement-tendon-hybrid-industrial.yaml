title:
  zh: 灵掌机器人 CTO 称采用仿生腱绳混合驱动灵巧手路线，聚焦工业场景
summary:
  zh: 6 月 13 日发布的访谈中，灵掌机器人 CTO 称公司定位为「垂类场景 + 全栈自研 + 灵巧操作模型」，技术路线上采用仿生腱绳混合驱动灵巧手，聚焦工业场景并结合垂直场景专用操作模型；主力产品 LZ-Pro 为 11 自由度、动态负载 15 公斤，LZ-Explore 为 23 自由度、动态负载 30 公斤，指尖力 40N、200 万次循环寿命；2025 年实现样品及小批量销售。
