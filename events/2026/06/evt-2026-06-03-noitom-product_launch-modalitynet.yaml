title:
  zh: 诺亦腾机器人正式发布以人为中心的全模态数据平台 ModalityNet，首发三大核心数据集
summary:
  zh: 6 月 3 日，诺亦腾机器人（Noitom Robotics）正式发布 ModalityNet.com 数据平台，聚焦以人为中心（Human-centric）的全模态数据，首发 HiPHI-MOV（高精度人体动作、手部姿态、交互物体网格与轨迹、第一人称/侧视视觉）、HiPHI-OM（面向灵巧操作，含手部触觉与 RGB-D 数据流）和 ITW（自然真实环境人类行为）三大核心数据集，预期产能达 45 万小时级，面向机器人企业、具身智能模型团队与学术科研提供数据基础设施；同期上线技术博客，并计划在 ICRA 2026 现场展示。
