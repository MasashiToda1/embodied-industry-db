title:
  zh: Genesis AI 发布首款通用机器人 Eno，轮式底盘加灵巧手，计划 2026 年底前量产并向工业客户部署
summary:
  zh: 6 月 16 日，Genesis AI 通过 PR Newswire 发布首款通用机器人 Eno，由公司基础模型 GENE 驱动，提供可显示机器人实时思考与执行状态的可选屏幕版本。公司计划 2026 年底前开始 Eno 的生产与定向客户部署，先面向制造、物流企业与实验室等工业客户，再到酒店、医院等服务业，最后是家庭与户外场景；新闻稿称还有其他本体形态在开发中。
