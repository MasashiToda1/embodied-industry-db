title:
  zh: Generalist AI 宣布 4 亿美元新融资，Radical Ventures 领投，累计融资超 5 亿美元
summary:
  zh: 6 月 4 日，Generalist AI 在官方博客宣布完成 4 亿美元新一轮融资，累计融资超过 5 亿美元。新进主要投资方包括 Radical Ventures（领投）、8VC、Union Square Ventures、Hanabi Capital、Norwest，NVIDIA、Boldstart Ventures、Spark Capital、Bezos Expeditions、NFDG 等现有主要投资方全部追加投资，新进天使投资人包括 Bin Lin、Fei-Fei Li、Naval Ravikant。博客未披露估值。
