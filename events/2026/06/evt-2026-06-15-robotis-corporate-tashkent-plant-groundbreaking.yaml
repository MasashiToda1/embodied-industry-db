title:
  zh: ROBOTIS 塔什干人形机器人及零部件工厂在 Yangi Avlod 特别工业区奠基，项目投资额 1 亿美元
summary:
  zh: ROBOTIS 在乌兹别克斯坦塔什干 Yangi Avlod 特别工业区举行人形机器人及零部件生产项目奠基仪式，项目由 O‘zeltexsanoat 协会发起。报道称项目计划吸引约 7000 万美元投资、创造 2000 余个岗位，在 10 公顷用地上建设生产综合体；项目介绍材料中的投资额为 1 亿美元。合作协议于 2025 年 12 月在韩国达成。
