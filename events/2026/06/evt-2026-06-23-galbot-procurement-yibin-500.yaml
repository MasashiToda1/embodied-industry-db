title:
  zh: 银河通用以 2.3592 亿元位列宜宾具身智能本体采购项目第一中标候选人
summary:
  zh: 宜宾某能源管理公司公示《具身智能本体及相关设备采购项目》候选人结果，银河通用以 2.3592 亿元报价位列第一中标候选人。项目预算约 2.57 亿元，采购
    500 台具身智能机器人（狗）本体及相关设施，含轮式机器人 380 台、重载机器人 80 台、机器狗 10 台等。报道称这是 2026 年以来国内单笔候选金额最高的具身智能机器人采购项目。注意：公示的是候选人结果，非最终中标公告。
