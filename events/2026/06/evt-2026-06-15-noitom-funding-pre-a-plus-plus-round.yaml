title:
  zh: 诺亦腾机器人完成数亿元人民币 Pre-A++ 轮融资
summary:
  zh: 6 月 15 日，诺亦腾机器人（Noitom Robotics）宣布完成数亿元人民币 Pre-A++ 轮融资，投资方包括北京市人工智能产业投资基金、上海人工智能产业系列基金、深创投、建发新兴投资、润璋创投、广发信德、中金资本、昆仑资本、元禾璞华等，老股东阿尔法公社、君联资本、五源资本、经纬创投等追加超额认购。资金用于具身智能多模态训练数据的采集、治理与交付能力建设，加速数据工厂、工程化平台和全球化服务体系落地。
