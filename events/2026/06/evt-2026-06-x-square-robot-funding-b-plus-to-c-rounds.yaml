title:
  zh: 自变量机器人连续完成 B+、B++ 和 C 轮融资，投中网称估值超 200 亿元
summary:
  zh: 投中网 6 月 29 日报道，自变量机器人在 4 月下旬宣布 B 轮融资后，又连续完成 B+、B++ 和 C 轮融资并全部交割，已确定的投资方包括中国移动、中保投资、红杉中国、IDG 资本、源码资本、达晨财智、中金资本等 30 多家机构，小米战投连续参与三轮。报道称其投后估值超过 200 亿元。
