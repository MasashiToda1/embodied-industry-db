title:
  zh: 大晓机器人完成天使+轮融资，吉利资本、达晨财智、深创投等参投，上半年累计融资数亿美元
summary:
  zh: 6 月 15 日，大晓机器人宣布近日完成天使+轮融资，投资方包括吉利资本、达晨财智、深创投、上海科创基金、沐曦股份、盛宇投资、复星锐正、华控基金、临港新片区基金、豫资涨泉等，老股东商汤国香资本持续增资，告捷资本担任长期财务顾问；公司称 2026 年上半年累计融资数亿美元。资金投入世界模型及「软硬一体」商业解决方案，面向智慧零售、安防巡检、文旅、酒店等场景。
