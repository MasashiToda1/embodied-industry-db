  zh: 戴盟机器人完成亿元 A 轮融资，汇川产投与中国电信联合投资
summary:
  zh: 证券时报 6 月 4 日报道，戴盟机器人近日完成亿元 A 轮融资，由汇川技术旗下产业基金汇川产投与中国电信联合投资，资金用于打造超大规模含物理交互信息数据集和物理世界模型研发。36氪报道称其视触觉传感器出货量居全球第一。
