summary:
  zh: 2026 年 6 月，中科慧灵与杰克科技签署 2000 台制鞋场景定制机器人的预交付订单，合同金额 4.04 亿元。机器人面向鞋体识别、柔性抓取、鞋底压合上下料、工位搬运等工序。信息来自新华网客户端 2026 年 7 月 18 日 WAIC 报道，具体签约日未披露。
