title:
  zh: 鹿明机器人完成数亿元 A1 及 A2 轮融资，三菱电机连续领投，累计融资近 10 亿元
summary:
  zh: 鹿明机器人宣布连续完成 A1 及 A2 两轮融资。A1 轮由三菱电机智能制造科技（中国）集团有限公司领投，老股东普华资本、吴中金控等跟投；A2 轮由三菱电机继续领投，恒生电子、海高集团、昆石投资等跟投。两轮完成后公司累计融资近 10 亿元，资金用于具身大模型研发和场景拓展。
