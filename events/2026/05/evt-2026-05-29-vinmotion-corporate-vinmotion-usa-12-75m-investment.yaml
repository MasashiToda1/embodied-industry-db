title:
  zh: Vingroup 批准以 1275 万美元收购 VinMotion USA, Inc. 股权，在美国设人形机器人研发中心
summary:
  zh: 据 Vingroup 5 月 29 日董事会决议及公司公告，Vingroup 将向特拉华州注册的 VinMotion USA, Inc. 投资 1275 万美元，方式为从子公司 VinMotion 手中收购其股份或出资额，目的为优化海外投资架构。项目名为「设立 VinMotion USA, Inc. 项目」，内容为人形机器人与技术方案研发，并在美国建立研发中心以吸引全球人才、与高校和研究机构合作；VinMotion USA 总部继续设在特拉华州。
