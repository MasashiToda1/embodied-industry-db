title:
  zh: 浙江人形与杰克科技签约 2000 台服装场景定制人形机器人；杰克科技称属战略框架目标
summary:
  zh: 在杰克科技主办的机器人战略转型峰会上，浙江人形机器人创新中心与杰克科技达成战略合作，现场签约 2000 台服装场景定制人形机器人。杰克科技 5 月 19 日在投资者互动平台表示，2000 台为双方联合开发规划数量，属战略合作框架目标，并非已签订的确定性销售订单，相关产品仍处于研发与联合验证阶段。
