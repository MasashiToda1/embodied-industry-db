title:
  zh: Foundation 称已获美国陆海空三军合计 2400 万美元研究合同，用于 Phantom 在巡检、物流与武器搬运上的可行性测试
summary:
  zh: 据 CNBC 2026 年 5 月 30 日报道，Foundation Future Industries 称已获得美国陆军、海军与空军合计 2400 万美元的政府研究合同，用于人形机器人 Phantom 在巡检、物流与武器搬运方面的可行性测试。RobotsBeat 4 月 24 日报道称该合同为测试性质而非量产采购。合同签署日期与分项金额未在来源中给出，amount 不填。
