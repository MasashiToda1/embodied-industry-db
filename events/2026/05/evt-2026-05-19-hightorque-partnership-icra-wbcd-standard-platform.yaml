title:
  zh: Panthera-HT 成为 ICRA 2026 WBCD Challenge 可变形物体操作赛道上海赛区官方标准平台，高擎与上海市人工智能行业协会共建具身智能训练基地
summary:
  zh: 5 月 19 日，高擎动力官网发文称旗下 Panthera-HT 机械臂成为 ICRA 2026 WBCD Challenge Deformable Manipulation Track（可变形物体操作赛道）上海赛区官方标准平台，为参赛队伍提供统一硬件、全套 SDK 与 ROS2 工作空间；同时高擎与上海市人工智能行业协会达成战略合作，共建具身智能训练基地，相关实训场地已建成开放。赛事于 2026 年 6 月 1—4 日举行，奖金池超 28 万美元。
