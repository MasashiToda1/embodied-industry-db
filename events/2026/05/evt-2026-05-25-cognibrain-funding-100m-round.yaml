  zh: 具脑磐石完成新一轮亿元级融资，多维资本担任独家财务顾问
summary:
  zh: 36 氪 5 月 25 日报道，具脑磐石完成新一轮亿元级人民币融资，由具备类脑与具身产业背景的产业资本领投，老股东及多家基金跟投，多维资本担任独家财务顾问，领投方名称未披露；公司称更新一轮融资在同步交割中。资金用于认知世界模型（Cognitive World Model）研发、团队扩充与全球市场拓展。
