title:
  zh: 日本 Zeon 通过 Zeon Ventures 投资 Sanctuary AI，并合作开发灵巧机器人专用材料
summary:
  zh: 2026 年 5 月，日本材料公司 Zeon Corporation 通过其风险投资部门 Zeon Ventures Inc.（加州）宣布投资 Sanctuary AI 并建立合作，Zeon 将以其弹性体材料与测试评估能力支持 Sanctuary AI 灵巧手（微型液压驱动加触觉传感）的产品开发。投资金额未披露。
