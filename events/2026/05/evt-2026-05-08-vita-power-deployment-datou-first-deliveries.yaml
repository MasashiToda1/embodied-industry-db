  zh: Vbot 超能机器狗「大头」5 月 8 日启动交付，首批 500 台量产下线
summary:
  zh: 上海证券报 5 月 11 日报道，维他动力首款产品 Vbot 超能机器狗「大头」已于 5 月 8 日正式启动交付，首批 500 台产品完成量产下线；公司称 5 月将完成超过 1500 名用户的交付，6 月产能提升到 2500 台以上。
