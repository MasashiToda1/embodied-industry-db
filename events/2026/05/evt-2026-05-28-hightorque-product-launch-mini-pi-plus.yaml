title:
  zh: 高擎动力在 ICRA 2026 全球首发 Mini Pi plus 小型人形机器人平台
summary:
  zh: 5 月 28 日，高擎动力官网发文《ICRA 2026丨Mini Pi plus 人形机器人平台全球首发，轻量化高性能加速科研！》（正文为图片）。官网产品页显示 Mini Pi plus 站立高度 680mm，重 15.15kg（含电池），22 自由度，负载 10kg，关节最大扭矩 21Nm，工作电压 24V，搭载自研一体化伺服关节模组与 NVIDIA Jetson Orin NX，开放 SDK，面向科研开发、教学实践与机器人竞赛场景。
