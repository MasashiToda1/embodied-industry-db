  zh: 具深科技完成数千万元融资，红杉中国种子基金等参投
summary:
  zh: 2026 年 5 月，上海具深科技有限公司完成数千万元人民币新一轮融资，由红杉中国种子基金、徐汇科创投、钧石创投、创源文化、深圳耀盈等联合参投；资金用于通用机器人小脑 CereBase 3.0 底层技术迭代、C 端机器人动作 UGC 内容生态建设、B 端 RaaS 服务全球化合规布局。报道称机时租 RoboNow 业务覆盖国内 15 个省份、全球 10 余个国家。
