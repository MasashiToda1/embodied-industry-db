title:
  zh: Skild AI 完成 SoftBank 领投的 C 轮融资，估值超 140 亿美元
summary:
  zh: 1 月 14 日，Skild AI 宣布完成 C 轮融资，由 SoftBank 领投，NVentures（NVIDIA 风投部门）、Macquarie Capital、Jeff Bezos（Bezos Expeditions）、Disruptive、1789 Capital 参投，Lightspeed、Felicis、Coatue、Sequoia Capital 追加投资，战略投资方包括 Samsung、LG、Schneider Electric、CommonSpirit、Salesforce Ventures，估值超过 140 亿美元。官方博客写融资额为 14 亿美元，Business Wire 新闻稿写「close to $1.4 billion」。
