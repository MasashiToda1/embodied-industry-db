title:
  zh: VinMotion 第二代人形机器人 Motion 2 在 CES 2026 高通展台展出，搭载 Qualcomm Dragonwing IQ9 处理器
summary:
  zh: 2026 年 1 月 CES 期间，高通发布面向机器人的全栈架构与 Dragonwing IQ10 处理器，并在展台展出 VinMotion 的人形机器人 Motion 2（搭载 Dragonwing IQ9 系列），同台展出的还有 Booster K1 Geek 与 Advantech 开发套件。高通称其 Dragonwing 工业处理器路线图已为 Booster、VinMotion 等公司的人形机器人供电，并将 VinMotion 列为合作伙伴之一。
