title:
  zh: 墨甲机器人完成天使轮外部增资，募资超 1 亿元，投后估值 25 亿元
summary:
  zh: 2026 年 1 月 21 日，奇瑞汽车旗下安徽墨甲智创机器人科技有限公司完成天使轮外部增资，总募资额超 1 亿元，投后估值 25 亿元。投资方包括伯特利（603596.SH）、富春染织（605189.SH）、智元机器人、IDG 资本、芜湖市科创集团、凤鸣创投等；报道称伯特利增资 3500 万元，奇瑞仍持股约 96%。
