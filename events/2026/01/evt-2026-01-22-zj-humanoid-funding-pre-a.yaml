summary:
  zh: 浙江人形机器人创新中心有限公司完成 4.5 亿元 Pre-A 轮融资，报道称自 2024 年年中以来累计筹资 22 亿元。股东包括中控技术、招商创科、联想创投、冯源资本、宁波工业互联网研究院、迦智科技、智昌科技等产业资本，浙江省创业投资集团、宁波金控控股集团、海发控股集团、越秀产业基金、宁波人才集团等政府产业资本，以及方广资本。
