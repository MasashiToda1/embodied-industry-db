title:
  zh: Mobileye 宣布以 9 亿美元收购 Mentee Robotics
summary:
  zh: 1 月 6 日，Mobileye 宣布签署最终协议收购以色列人形机器人公司 Mentee Robotics Ltd.，总对价 9 亿美元（含调整条款），由约 6.12 亿美元现金和最多约 2620 万股 Mobileye A 类普通股构成，计划 2026 年第一季度完成交割。Mentee 将作为 Mobileye 内部独立单元运营；Mobileye 称首批客户现场概念验证部署在 2026 年，量产与商业化目标为 2028 年。Ctech 报道称 Mentee 此前仅融资 1700 万美元，由 Ahren Innovation Capital 领投。
