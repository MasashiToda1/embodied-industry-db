title:
  zh: 北京人形机器人创新中心中试验证平台启动，第 1000 台客户定制化样机下线
summary:
  zh: 1 月 29 日，北京人形机器人创新中心中试验证平台在北京亦庄正式启动，现场下线第 1000 台客户定制化人形机器人样机。平台占地 9700 平米，2025 年建成投产，拥有 500 台套试制生产和测试设备，具备具身智能机器人年产能 5000 台套的能力，面向产业链企业、高校、科研院所开放试制打样、工艺验证、装调与测试服务。
