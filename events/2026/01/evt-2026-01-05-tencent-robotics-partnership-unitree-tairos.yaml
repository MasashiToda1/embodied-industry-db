title:
  zh: 腾讯 Robotics X 与宇树科技达成战略合作，Tairos 具身大模型部署于宇树 G1 落地敦煌导览
summary:
  zh: 2026 年 1 月 5 日，腾讯 Robotics X 实验室与宇树科技达成战略合作：腾讯以 SDK 和云服务形式提供 Tairos（钛螺丝）规划大模型与多模态感知模型，宇树及其生态企业负责部署到旗下主流机型并完成系统集成，面向文旅景区、商场、企业展厅等场景。2026 年元旦起，部署 Tairos 的宇树 G1 导览机器人「小莫」在敦煌莫高窟数字展示中心上岗试运营，另一试点位于上海一家律师事务所展厅。
