title:
  zh: 拓斯达在全球开放日发布首款轮式人形机器人「小拓」，并发起人形机器人生态创新联盟
summary:
  zh: 9 月 12 日，拓斯达在东莞举办「AI 无界 智造共生——拓斯达全球开放日 2025」，旗下矩阵智拓发布首款人形机器人「小拓」，为轮式人形机器人，基于拓斯达与智谱共同构建的具身模型，集成 3D 相机与 AI 视觉检测系统，已在注塑车间完成多轮验证，能识别注塑件良率并自主完成装盘。同场拓斯达与伯恩光学、尼得科、THK、奥比中光、华南理工大学等发起「拓斯达人形机器人生态创新联盟」。
