summary:
  zh: 机器人检测认证联盟发布并实施CR-3-0602TS:2025《人形机器人数据采集训练场技术规范》。原文将睿尔曼、上海人形机器人创新中心、北京人形机器人创新中心、宇树、小米、优必选、智元等列为起草单位；本条记录参与起草与规范发布，不表述为睿尔曼独家标准或2026年新标准。
