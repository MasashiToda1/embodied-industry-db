title:
  zh: 首形科技完成新一轮过亿元融资，蚂蚁集团领投
summary:
  zh: 9 月 29 日，首形科技（AheadForm）宣布完成新一轮过亿元融资，为 2025 年内第三轮，由蚂蚁集团领投、锦秋基金联合投资，厚雪资本、弘晖基金、鹏城愿景基金参与，老股东顺为资本、招商局创投、Taihill 追投。资金用于情绪基座模型迭代与多场景应用落地。
