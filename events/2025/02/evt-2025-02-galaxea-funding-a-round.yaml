title:
  zh: 星海图完成 A 轮融资，蚂蚁集团独家领投
summary:
  zh: 星海图完成新一轮 A 轮融资，报道称总融资额「近 3 亿元人民币」。本轮融资由蚂蚁集团独家领投，高瓴创投、IDG 资本、北京机器人产业基金、百度风投、同歌创投等老股东持续加码，华兴资本担任独家财务顾问。资金将用于加速具身基础模型的研发和验证。
