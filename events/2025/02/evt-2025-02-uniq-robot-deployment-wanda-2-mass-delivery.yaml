title:
  zh: 优理奇 Wanda 2.0 自 2025 年 2 月开始量产交付，公司称已完成超千万元订单
summary:
  zh: 极客公园稿件写明优理奇的轮式双臂机器人已于 2025 年 2 月开始量产交付，售价压在十万元以内，公司表示已经完成超千万元订单。稿件写明 8.8 万元版本的 Wanda 2.0 单臂负载 2 公斤、单臂 8 自由度、全身 23 自由度，续航 6 至 8 小时；公司实现核心部件全自研，80% 硬件自主设计。
