title:
  zh: 百度智能云与智元机器人签署战略合作协议，共建可二次开发的人形机器人平台
summary:
  zh: 2 月 27 日，百度智能云与智元机器人签署战略合作协议，围绕具身生态解决方案建设、关键技术与产品研发、生态协同合作。首期落地阶段聚焦教育市场，依托百度智能云「视觉大模型 + 边缘计算」软硬一体方案，结合智元远征系列数采与交互服务机器人、灵犀全栈开源机器人、AIDEA 全栈数采方案，共建可二次开发的人形机器人平台，师生可在平台内置的行业模型库与算法产线上训练物品分拣、环境巡检等任务模型。
