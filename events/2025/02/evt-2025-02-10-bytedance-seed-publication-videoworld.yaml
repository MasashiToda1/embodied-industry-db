title:
  zh: 字节跳动 Seed 开源视频生成实验模型 VideoWorld
summary:
  zh: 2 月 10 日，字节跳动 Seed 发文介绍并开源视频生成实验模型 VideoWorld，该模型由豆包大模型团队与北京交通大学、中国科学技术大学联合提出，不依赖语言模型，仅通过浏览视频数据学习推理、规划与决策。团队称在 300M 参数量下达到专业 5 段 9x9 围棋水平，并可在多种环境中执行机器人任务。论文收录于 CVPR 2025。
