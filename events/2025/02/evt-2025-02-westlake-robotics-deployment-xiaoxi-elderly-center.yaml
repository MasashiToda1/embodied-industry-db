summary:
  zh: 每日商报稿件写明 2025 年 2 月「小西」在杭州西湖区古荡街道的一个民生综合体上岗，食堂用餐时间背着餐盒穿梭在点餐区和用餐区之间，为就座等待的老人送上餐食。稿件同时写明「小西」目前在多个养老服务中心进行试点实验。
