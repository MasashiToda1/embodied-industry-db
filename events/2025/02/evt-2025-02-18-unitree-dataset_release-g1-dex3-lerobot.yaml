title:
  zh: 宇树科技在 Hugging Face 发布 G1 Dex3 操作数据集系列
summary:
  zh: 宇树科技在 Hugging Face 以 LeRobot 格式发布 G1 搭配 Dex3 灵巧手的操作数据集系列，首个数据集 G1_Dex3_BlockStacking_Dataset 含 281k 行、300 个 episode，采用 Apache-2.0 许可，标注任务类别为 Robotics，模态包含 tabular、time-series 与 video。同期发布的还有 G1_Dex3_CameraPackaging、G1_Dex3_GraspSquare、G1_Dex3_ObjectPlacement 等同系列数据集。
