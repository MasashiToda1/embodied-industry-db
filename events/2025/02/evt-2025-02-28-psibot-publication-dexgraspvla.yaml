summary:
  zh: 2025 年 2 月 28 日，论文《DexGraspVLA》提交至 arXiv，作者单位为北京大学人工智能研究院与 PKU-PsiBot 联合实验室。论文提出分层框架，用预训练视觉语言模型做高层规划、扩散式低层动作控制器做执行，实验平台为 7 自由度 RealMan RM75-6F 机械臂配 6 自由度 PsiBot G0-R 灵巧手。灵初智能官网将该论文列为随 Psi R0.5 公开的四篇论文之一。
