title:
  zh: Figure AI 宣布退出与 OpenAI 的合作协议，转向全自研端到端机器人 AI
summary:
  zh: 2 月 4 日，Figure AI 在 X 上宣布退出与 OpenAI 的 Collaboration Agreement，理由是公司在完全自研的端到端机器人 AI 上取得突破。公司对 TechCrunch 表示「要在真实世界规模化解决具身 AI，就必须把机器人 AI 垂直整合」，并称会在 30 天内展示人形机器人上前所未见的成果。双方此前于 2024 年宣布合作开发人形机器人下一代 AI 模型，Figure 02 曾计划使用 OpenAI 模型做自然语言交互。
