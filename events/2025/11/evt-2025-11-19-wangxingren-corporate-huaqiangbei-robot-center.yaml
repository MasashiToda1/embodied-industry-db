title:
  zh: 汪星人运营的全球机器人选品中心在深圳华强北开业
summary:
  zh: 2025 年 11 月 19 日，由汪星人（广东）供应链科技有限公司运营的全球机器人选品中心在深圳华强北曼哈商业广场开业，将机器人租赁、销售、二次开发与场景化服务打包提供。报道称该中心汇聚 AI 智能玩具、工业机器人、家用服务机器人、特种机器人及芯片、传感器、电机等零部件。
