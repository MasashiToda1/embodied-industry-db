title:
  zh: 智元创新完成股改，改制为股份有限公司
summary:
  zh: 2025 年 11 月 10 日报道，近日智元机器人关联公司智元创新（上海）科技有限公司发生工商变更，企业名称变更为智元创新（上海）科技股份有限公司，企业类型由有限责任公司（外商投资、非独资）变更为股份有限公司。智元机器人董事长兼 CEO 邓泰华称年底将完成 C 轮融资。
