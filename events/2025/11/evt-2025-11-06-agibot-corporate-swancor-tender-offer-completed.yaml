title:
  zh: 智元恒岳对上纬新材的要约收购完成股份交割，合计持股 63.6232%
summary:
  zh: 11 月 6 日晚间，上纬新材公告，智元机器人旗下上海智元恒岳科技合伙企业（有限合伙）对其发起的要约收购已完成股份交割，智元恒岳持有上纬新材 2.36 亿股（占总股本 58.6232%），智元恒岳及其一致行动人合计持有 2.57 亿股（占总股本 63.6232%）。彭志辉等 8 人被提名为上纬新材第四届董事会董事候选人。
