title:
  zh: 原力灵机完成数亿元 A+ 轮融资，阿里巴巴独家投资
summary:
  zh: 11 月 14 日，Dexmal 原力灵机通过官方公众号宣布完成数亿元人民币 A+ 轮融资，阿里巴巴为独家投资方。此前 A 轮由蔚来资本领投，洪泰基金、联想创投、锡创投、正景基金跟投，君联资本、启明创投、九坤创投追投；两轮融资金额近 10 亿元。
counterparties:
- 阿里巴巴
- 蔚来资本
