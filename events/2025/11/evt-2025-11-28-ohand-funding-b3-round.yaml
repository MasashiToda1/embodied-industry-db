title:
  zh: 傲意科技完成 B3 轮战略融资，由雷迪克独家投资 1.6 亿元
summary:
  zh: 上海傲意信息科技有限公司宣布完成亿元 B3 轮战略融资，由创业板上市公司雷迪克（300652）独家投资，为公司 2025 年内第三轮过亿元融资。雷迪克在 2026 年 1 月 5 日发布的投资者关系活动记录表中称，本次投资 1.6 亿元参与傲意科技 B3 轮融资。公司称融资用于量产能力升级、全场景技术研发与全球化布局。
