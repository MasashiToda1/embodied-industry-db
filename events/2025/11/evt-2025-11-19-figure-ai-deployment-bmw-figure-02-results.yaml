  zh: 11 月 19 日，Figure 公布 Figure 02 在 BMW Group Plant Spartanburg 为期 11 个月的部署结果：在车身车间承担钣金件上料（pick-and-place），周一至周五每天运行 10 小时班次，累计上料 9 万余件、运行 1250 小时以上，参与 3 万余辆 X3 车型生产。公司同时宣布随 Figure 03 发布启动 Figure 02 全机队退役。
