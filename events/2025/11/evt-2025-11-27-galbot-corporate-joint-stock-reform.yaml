title:
  zh: 银河通用完成股改，更名为北京银河通用机器人股份有限公司
summary:
  zh: 11 月 27 日，银河通用完成股改，公司名称从「北京银河通用机器人有限公司」变更为「北京银河通用机器人股份有限公司」，市场主体类型从有限责任公司（外商投资、非独资）变更为股份有限公司（外商投资、非上市）。12 月 9 日公司回应赴港上市传闻称信息不属实，股改是为满足后续融资需求。
