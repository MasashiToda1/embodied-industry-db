title:
  zh: 凯龙高科拟以 500 万元增资灵掌机器人，投后估值 2 亿元
summary:
  zh: 11 月 21 日，凯龙高科技股份有限公司公告，拟以货币方式对无锡灵掌机器人科技有限公司增资 500 万元，按增资后整体估值 2 亿元定价，增资完成后持有灵掌机器人 2.50% 股权；本次增资前凯龙高科实际控制人已参股灵掌机器人 2%，构成关联交易。
