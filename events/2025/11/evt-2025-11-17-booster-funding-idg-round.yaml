title:
  zh: 加速进化完成超亿元新一轮融资，IDG 资本领投
summary:
  zh: 11 月 17 日，证券时报报道加速进化完成新一轮超亿元融资，由 IDG 资本投资、亦庄国投跟投，老股东源码资本、英诺天使基金、深创投集团、博华资本等继续加注，义柏资本担任独家财务顾问。资金用于产品研发升级、规模化量产交付及生态平台服务建设。报道称截至当时公司人形机器人全球累计出货量已突破 700 台。
