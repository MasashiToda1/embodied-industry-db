title:
  zh: 普罗宇宙发布工业级轮式具身机器人大白 2.0、四款末端执行器与灵巧手普罗小灵
summary:
  zh: 11 月 1 日，普罗宇宙机器人 2025 新品发布会在北京亦庄京东总部举办，发布工业级轮式具身机器人普罗宇宙大白 2.0 版、四款末端执行器（覆盖锁付、焊锡、点胶、涂油工艺）及灵巧手普罗小灵。大白 2.0 在 300 多个性能点升级，具备亚毫米级操作精度，可集成企业 MES 系统。
