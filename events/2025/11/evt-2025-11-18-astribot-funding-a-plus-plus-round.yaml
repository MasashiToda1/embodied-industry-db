title:
  zh: 星尘智能完成数亿元 A++ 轮融资，国科投资与蚂蚁集团联合领投
summary:
  zh: 11 月 18 日，星尘智能（Astribot）完成数亿元 A++ 轮融资，由国科投资和蚂蚁集团联合领投，Bloom Advance Capital、时代伯乐、南山战新投跟投，老股东锦秋基金追投。资金用于研发人才梯队建设、绳驱本体规模化制造准备及多场景解决方案深化。公司称已在 10 月 IROS 展示半身商用机器人 Astribot S1-U。
