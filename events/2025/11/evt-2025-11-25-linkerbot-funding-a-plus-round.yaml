title:
  zh: 灵心巧手完成数亿元 A+ 轮融资，乐聚机器人、奥克斯等参投
summary:
  zh: 11 月 25 日，据灵心巧手官方公众号消息，灵心巧手（北京）科技有限公司宣布完成数亿元人民币 A+ 轮融资。本轮由浙江创新投资、德清产投、乐聚机器人、鼎晖百孚、晶华新材、东方精工、奥克斯、华福投资、弘颐基金、洪山资本、祥源新材等共同参与。公司表示 2026 年计划交付 5 万至 10 万台灵巧手。
