title:
  zh: 舍弗勒与 NEURA Robotics 建立技术合作：联合开发并供应人形机器人执行器，舍弗勒计划到 2035 年在生产网络部署数千台 NEURA 人形机器人
summary:
  zh: 11 月 4 日，舍弗勒（Schaeffler）发布新闻稿称与 NEURA Robotics 建立技术合作，内容包括联合开发并供应人形机器人关键部件（如执行器），以及人形机器人采购协议：舍弗勒将在全球生产网络部署 NEURA 的人形机器人，到 2035 年整合「中等四位数」数量的人形机器人。NEURA 借此锁定其紧凑轻量、可连续运行执行器的相当部分需求；双方在生产环境采集运动与交互数据用于训练 AI 模型，数据进入 Neuraverse。舍弗勒称其面向人形机器人的行星齿轮执行器产品扭矩最高 250 Nm。
