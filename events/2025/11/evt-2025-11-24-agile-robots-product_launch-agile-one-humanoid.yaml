  zh: 思灵机器人发布全尺寸工业级人形机器人 Agile ONE
  en: Agile Robots launches full-size industrial humanoid Agile ONE
summary:
  zh: 11 月 24 日，思灵机器人官网发布全尺寸工业级人形机器人 Agile ONE，面向工业环境，通过 AgileCore AI 软件平台与公司灵巧手、力控机械臂、自主移动机器人协同。官网产品页给出参数：高 174 厘米、重 69 千克、行走速度 2.0 米 / 秒、负载 20 千克。公司同时披露累计向全球客户交付超过 20000 套机器人解决方案、员工 2500 人。
