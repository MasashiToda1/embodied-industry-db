  zh: 11 月 20 日，SiliconANGLE 援引 Bloomberg 与 The Information 报道，Physical Intelligence 完成 6 亿美元新一轮融资，估值 56 亿美元。Alphabet 旗下成长基金 CapitalG 领投，老股东 Lux Capital、Thrive Capital、Jeff Bezos 跟投，新投资方包括 Index Ventures 与 T. Rowe Price。报道指出公司本身未正式披露该轮融资，信息来自知情人士。
