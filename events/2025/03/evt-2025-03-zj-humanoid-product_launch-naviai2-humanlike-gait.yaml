title:
  zh: 浙江人形机器人创新中心发布「领航者 2 号 NAVIAI」升级，实现 7 自由度作业臂下的全身拟人化行走
summary:
  zh: 3 月 10 日，浙江人形机器人创新中心发布全尺寸人形机器人「领航者 2 号 NAVIAI」的最新升级视频，本次升级实现 7 自由度精准作业臂下的全身人机映射拟人化行走。稿件写明该机型单臂 7 自由度、负载 5 公斤、操作精度 0.1 毫米，自重 4.2 公斤；中国宁波网稿件写明其在身高体重与成年人相仿的前提下实现拟人姿态的稳步行走，可在水泥路、柏油路、塑胶跑道等多种路面平稳行走，最快步行速度每秒 1.5 米。中心相关人员表示正在让该机型进入科研教育、智慧零售、智能制造等行业，包括与宁波本地高校合作提供科研设备、参与商超货物分拣与搬运、在中控技术富阳工厂用刷子蘸取涂料覆在印制电路板上。
