title:
  zh: 数字华夏在南京软件谷成立具身智能机器人应用中心，并与江苏移动、科大讯飞签署合作协议
summary:
  zh: 3 月 18 日上午，具身智能机器人应用中心在中国（南京）软件谷成立，由数字华夏旗下华夏机器人（南京）有限公司建设，定位为基于真实交互场景的人形机器人数据采集及应用中心，覆盖家庭服务、康养陪护等场景，建立包含动作、语音、表情的多模态数据库。同日，华夏机器人（南京）有限公司与江苏移动信息系统集成有限公司、科大讯飞股份有限公司举行合作协议签署仪式。通用人形机器人「夏起」在成立仪式上首次公开亮相，10 台夏起同步群舞。
counterparties:
- 江苏移动信息系统集成有限公司
- 科大讯飞股份有限公司
- 中国（南京）软件谷
