title:
  zh: 帕尔机器人开源移动操作机器人 TIAGo Pro 的 ROS 2 软件栈
summary:
  zh: 3 月 19 日，帕尔机器人在 GitHub 组织 pal-robotics 下建立 tiago_pro_robot 仓库，以 Apache-2.0 协议开源移动操作机器人 TIAGo Pro 的 ROS 2 软件栈，含 tiago_pro_bringup、tiago_pro_controller_configuration、tiago_pro_description 与 tiago_pro_robot 四个子包，package.xml 中的维护者邮箱为 pal-robotics.com 域名。同年 3 月 31 日起，该组织下陆续建立 tiago_pro_simulation、tiago_pro_moveit_config、tiago_pro_head_robot 与 tiago_pro_head_simulation 等配套仓库。
