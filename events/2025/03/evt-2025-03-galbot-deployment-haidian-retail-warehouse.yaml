title:
  zh: 银河通用人形机器人零售仓在北京海淀北下关街道落地
summary:
  zh: 银河通用的人形机器人智慧零售解决方案在北京海淀区北下关街道落地，机器人店员 Galbot 在专为机器人打造的「零售仓」中销售医疗器械等商品，接到线上订单后完成分拣、打包和出货。据报道，Galbot 可在 50 平方米门店内完成 5000 种商品、6000 个货道的自动化全流程操作，截至 2025 年 8 月已上岗超过 150 天，该方案已在北京全市超过十家门店上岗。
