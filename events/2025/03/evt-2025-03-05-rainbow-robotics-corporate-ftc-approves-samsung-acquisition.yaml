title:
  zh: 韩国公平交易委员会批准三星电子收购彩虹机器人
summary:
  zh: 3 月 5 日，韩联社报道韩国公平交易委员会（FTC）批准三星电子对彩虹机器人的收购，距三星提交审查约两个月，理由是该交易形成垄断的可能性很小。三星电子目前持有彩虹机器人 35% 股份，2023 年曾向其投资 868 亿韩元。
