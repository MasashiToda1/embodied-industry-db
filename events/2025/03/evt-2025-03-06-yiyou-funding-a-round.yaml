title:
  zh: 意优科技完成五千万元 A 轮融资
summary:
  zh: 3 月 6 日，人形机器人核心关节模组制造商意优科技宣布完成五千万元人民币 A 轮融资，由浦东创投集团旗下浦东天使基金、张江科投旗下张科垚坤基金联合领投，TCL 创投、道生资本、锡创投旗下金投致源跟投，资金用于核心技术研发与生产产能扩张。报道称本轮融资后公司主体将变更为上海意优智控科技有限公司并迁入上海张江机器人谷。
