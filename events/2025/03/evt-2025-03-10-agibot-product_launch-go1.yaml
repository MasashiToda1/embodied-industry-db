title:
  zh: 智元机器人发布通用具身基座大模型 GO-1 与 ViLLA 架构
summary:
  zh: 3 月 10 日，智元机器人发布 Vision-Language-Latent-Action（ViLLA）架构与通用具身基座大模型 GO-1（Genie Operator-1）。GO-1 由 VLM 与 MoE 组成，VLM 主干网络继承开源多模态大模型 InternVL2.5-2B 的权重，整合视觉、语言、动作、触觉等多模态输入并输出机器人动作执行序列。
