summary:
  zh: 2025 年 3 月 24 日，BeingBeyond 在 GitHub 组织下建立 Being-M0 仓库。README 称团队构建了 MotionLib——面向动作生成的百万级数据集，规模至少为已有同类数据集的 15 倍，并带分层文本描述；基于 MotionLib 训练出大型动作模型 Being-M0。对应论文《Scaling Motion Generation Models with Million-Level Human Motions》收录于 ICML 2025。
