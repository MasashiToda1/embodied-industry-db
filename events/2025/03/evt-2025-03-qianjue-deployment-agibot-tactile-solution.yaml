title:
  zh: 千觉机器人触觉感知方案落地智元机器人
summary:
  zh: 千觉机器人自主研发的触觉仿真工具 Xense_Sim 与多模态高精度触觉传感器 G1-WS 落地应用于智元机器人，用于完备数据采集模态。G1-WS 专为机器人夹爪设计，三维形状测量分辨率为每平方厘米 5 万个测量点，X/Y 方向精度 0.03mm、Z 方向精度 0.06mm，每帧力场处理时间 10ms；Xense_Sim 可模拟切向运动与力信息，处理速度 50Hz，已集成至 Isaac Sim 仿真平台。
