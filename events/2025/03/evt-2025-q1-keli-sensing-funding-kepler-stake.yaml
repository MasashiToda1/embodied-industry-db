title:
  zh: 柯力传感战略投资开普勒机器人并持有 1.55% 股权
summary:
  zh: 柯力传感 2024 年年度报告披露，公司于 2025 年一季度完成对开普勒机器人的战略投资，股权关系为参股，被投企业核心产品为人形机器人、灵巧手。公司在投资者关系平台答复中称持有开普勒机器人 1.55% 股权，双方将在传感器技术创新、供应链协同、产业化推进等方面加强合作。
