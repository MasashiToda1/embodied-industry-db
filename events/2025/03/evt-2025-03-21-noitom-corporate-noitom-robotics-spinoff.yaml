  zh: 诺亦腾把机器人团队分拆为独立公司诺亦腾机器人
summary:
  zh: 2025 年年初，诺亦腾将其搭建的机器人团队拆分为独立运营与融资的新公司，新公司命名为诺亦腾机器人（Noitom Robotics），主要业务聚焦机器人数据。工商信息显示，诺亦腾机器人科技（北京）有限公司成立于 2025 年 3 月 21 日，注册地为北京市海淀区，业务定位是为人形机器人与具身智能产业提供从真机到人类交互的全链路数据解决方案。
