title:
  zh: 松延动力宣布完成连续两轮过亿元 A 轮及 A+ 轮融资
summary:
  zh: 3 月 17 日，松延动力北京科技有限公司宣布完成连续两轮过亿元 A 轮及 A+ 轮融资。A+ 轮由彬复资本领投，华强资本跟投；A 轮投资方包括神骐资本、北京未来科学城基金、天启资本、泽然资本、教育科技集团战略方等机构。北京商报报道称公司已完成五轮融资，已拿到数千万元采购订单，主要集中在科研教育、教学教具、展览展示领域，2025 年计划完成近千台交付。
counterparties:
- 彬复资本
- 华强资本
- 神骐资本
- 北京未来科学城基金
- 天启资本
- 泽然资本
