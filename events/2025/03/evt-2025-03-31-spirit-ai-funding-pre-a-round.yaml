summary:
  zh: 3 月 31 日，千寻智能完成 5.28 亿元人民币 Pre-A 轮融资。本轮由阿美风险投资旗下 Prosperity7 Ventures（P7）领投，招商局创投、广发信德、靖亚资本、东方富海、华控基金等参与，华发集团、浙江省科创母基金与浙江东方共同发起设立的善富科创子基金参与；老股东达晨财智、柏睿资本、弘晖基金、千乘资本持续加码。
