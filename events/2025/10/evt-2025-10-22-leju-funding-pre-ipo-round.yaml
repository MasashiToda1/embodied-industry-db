title:
  zh: 乐聚机器人完成 Pre-IPO 轮融资，深投控资本等联合投资
summary:
  zh: 10 月 22 日报道，乐聚机器人于近日完成 Pre-IPO 轮融资，金额规模 15 亿元（另有报道为「近 15 亿元」），由深投控资本、深圳龙华资本、前海基础投资、石景山产业基金、东方精工、拓普集团、中信金石、中证投资、道禾长期投资、盛奕资本、联新资本、探针创投、合肥产投、玖兆投资及中美绿色基金联合投资。
