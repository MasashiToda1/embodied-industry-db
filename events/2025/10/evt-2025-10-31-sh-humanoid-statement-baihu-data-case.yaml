  "summary": {
    "zh": "国家数据局发布的案例列人形机器人（上海）有限公司与第伍要素（上海）数据科技有限公司为申报单位，披露依托超 5000 平方米训练场、超过 100 台多构型机器人，累计形成超 100 万条、2.5 PB 真机数据，包含关节位姿、图像和文本，并以仿真场景合成数据。记录为案例披露，不认定该日首次发布数据集或已开放全部数据下载。"
