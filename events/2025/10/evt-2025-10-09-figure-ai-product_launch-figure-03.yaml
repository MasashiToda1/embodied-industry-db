  zh: 10 月 9 日，Figure 发布第三代人形机器人 Figure 03，公司称其面向 Helix 模型、家庭场景与规模化量产做了软硬件整体重新设计，新增带触觉传感与掌心摄像头的手部、可拆洗软质外覆件、无线足底充电。公司同时披露自建工厂 BotQ 第一代产线初期年产能最高 1.2 万台，目标四年内累计生产 10 万台。
