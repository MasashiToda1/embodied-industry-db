title:
  zh: 谋先飞与武汉临空港经开区签约共建机器人仿真训练场，同日发布 MotrixLab 并设华中总部
summary:
  zh: 10 月 30 日，武汉临空港经济技术开发区管委会（东西湖区）与北京谋先飞技术有限公司在国家网络安全人才与创新基地签署合作协议，双方打造全国首个全链条自主可控的机器人仿真训练场并对外开放，东西湖区现代服务产业办和临空港网安运营公司以共建运营模式参与。活动现场谋先飞发布物理引擎平台 MotrixLab，与多家机器人公司及需求方完成业务签约，北京大学、哈尔滨工业大学等高校采购了其仿真训练场技术用于教学科研；谋先飞宣布在东西湖区设立华中总部及研发中心。
counterparties:
- 武汉临空港经济技术开发区管委会（东西湖区）
- 北京大学
- 哈尔滨工业大学
