  zh: 松延动力消费级人形机器人「小布米」上线京东，定价 9998 元
summary:
  zh: 10 月 23 日，松延动力人形机器人「Bumi 小布米」上架京东平台，定价 9998 元。投资界报道该机身高 94cm、重约 12kg、21 个以上自由度，支持行走、奔跑、舞蹈、语音交互与图形化编程；证券时报报道上线后一小时售出百台，两天首批 500 台售罄，截至 11 月 26 日线上线下累计售出数千台。
