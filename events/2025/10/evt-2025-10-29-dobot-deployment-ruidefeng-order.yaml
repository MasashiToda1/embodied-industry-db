title:
  zh: 瑞德丰向越疆采购超 8050 万元具身智能机器人
summary:
  zh: 10 月 29 日，越疆机器人与瑞德丰精密技术股份有限公司签署具身智能机器人采购合同。瑞德丰采购总金额超 8050 万元，内容包含人形机器人及具身智能协作机器人在内的产品与解决方案，用于新能源精密制造产线的高精度组装、复杂物料流转与柔性产线协同。
