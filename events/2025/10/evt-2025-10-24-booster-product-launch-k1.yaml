  zh: 加速进化生态大会发布具身开发入门级平台 Booster K1
summary:
  zh: 2025 年 10 月 24 日，加速进化首次举办生态大会，发布具身开发入门级平台 Booster K1、Booster Agents、面向开发者的「起航计划」和面向教育市场的「百城万校」计划。钛媒体报道，Booster K1 当日在淘宝天猫等平台首发，首批全款订单 20 分钟售罄，发布会现场经销商签约订单突破千台。
