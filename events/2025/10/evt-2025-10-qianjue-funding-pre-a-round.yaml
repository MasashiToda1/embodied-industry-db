title:
  zh: 千觉机器人完成亿元级 Pre-A 轮融资，孚腾资本领投、理想汽车参投
summary:
  zh: 千觉机器人（Xense Robotics）宣布完成亿元级 Pre-A 轮融资，为其 2025 年内第三轮融资。本轮由孚腾资本（上海具身智能基金）领投，理想汽车等产业方及彬复资本、科实资本联合参投，高瓴创投、元禾原点、戈壁创投等老股东加注。报道称公司成立于 2024 年 5 月，总部上海。
