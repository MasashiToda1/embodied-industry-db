title:
  zh: 大咖机器人 X7 系列人形机器人启售，EDU 版标准价 8.98 万元、早鸟价 6.98 万元起
summary:
  zh: 10 月 13 日，大咖机器人 X7 系列正式启售，限量 100 台。X7 EDU 版标准价 8.98 万元，早鸟价 6.98 万元起，X7 Pro 版未公布价格。X7 系列设计身高 170 厘米，双七轴机械臂，双臂最大负载 10 公斤；EDU 版全身 23 个自由度（含 6 个底盘自由度），Pro 版 26 个自由度并配腕部与头部深度摄像头、底盘激光雷达。文中提到 9 月下旬公司与姬械机科技集团达成合作，将为其提供上百台人形机器人用于康养与应急机构。
