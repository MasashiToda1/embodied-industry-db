title:
  zh: 阿里达摩院在世界机器人大会开源 RynnVLA-001-7B、RynnEC 与机器人上下文协议 RynnRCP
summary:
  zh: 8 月 11 日，在世界机器人大会上，阿里达摩院宣布开源自研的 VLA 模型 RynnVLA-001-7B、世界理解模型 RynnEC 与机器人上下文协议 RynnRCP。RynnVLA-001 基于视频生成与人体轨迹预训练，从第一人称视角视频学习操作技能并迁移到机械臂；RynnEC 从位置、功能、数量等 11 个维度解析场景物体；RynnRCP 包含 RCP 框架与 RobotMotion 两个模块，打通传感器数据采集、模型推理到动作执行的工作流，已支持 Pi0、GR00T N1.5 等模型与 SO-100、SO-101 等机械臂。RobotMotion 自带基于 MuJoCo 的物理仿真与真机调试、数据采集、轨迹可视化工具。
