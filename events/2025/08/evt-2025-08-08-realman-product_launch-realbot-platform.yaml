title:
  zh: 睿尔曼在 2025 世界机器人大会发布 RealBOT 具身开源平台
summary:
  zh: 2025 世界机器人大会期间，睿尔曼以「具身智能基座」为核心理念携全产品矩阵亮相，并在京东主展区发布新品 RealBOT 具身开源平台。报道称该平台面向机器人高质量数据采集，基于石景山区人形机器人数据训练中心十大应用场景的百万条数据构建，并与远程打工仔平台整合。
