summary:
  zh: 在 2025 世界机器人大会首日，帕西尼全球首发第三代多维触觉传感器矩阵 PX-6AX-GEN3，涵盖 Elite、Core、Omega 三大系列共 12 款不同尺寸及型号，并同步开启预售。Elite 系列面向性价比与高性能指标，Core 系列配备更密集的测点与更多构型，Omega 系列通过表层结构优化扩大接触面积。
