title:
  zh: 北京人形机器人创新中心在 2025 世界机器人大会发布天工、天轶 2.0 产品矩阵
summary:
  zh: 8 月 8 日，2025 世界机器人大会在北京开幕，北京人形机器人创新中心（国地共建具身智能机器人创新中心）携天工、天轶系列 2.0 产品矩阵亮相，并在大会上发布具身世界模型体系、具身多模态大模型、人形机器人全自主导航系统、跨本体 VLA 模型等技术，演示了工业场景下异构多本体协同工作。开幕式上天工 2.0 作为主持人登台。
