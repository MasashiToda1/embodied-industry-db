title:
  zh: 汇川技术称人形机器人用行星滚柱丝杠已进入客户端送样阶段，直线模组与旋转关节模组在开发中
summary:
  zh: 汇川技术在 8 月 26 日的业绩说明会上回答投资者提问，称目前研发的人形机器人核心零部件包括驱动器和电机，重点通过提升电机的扭矩密度和控制温升来解决行业痛点，会把电机在工业领域大批量应用的经验和技术积累应用于人形机器人；行星滚柱丝杠产品已进入客户端送样阶段，尚未实现量产；直线模组和旋转关节模组等产品在开发中，待产品发布后会在客户端推广。公司还称人形机器人零部件开发主要基于自身技术积累，先搭建基础平台并开发标准化产品，随后根据客户需求定制。
