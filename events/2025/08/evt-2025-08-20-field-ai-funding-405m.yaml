title:
  zh: Field AI 宣布两轮累计融资 4.05 亿美元
summary:
  zh: 8 月 20 日，Field AI 发新闻稿宣布在连续两轮融资中累计募得 4.05 亿美元。新闻稿列出的投资方包括 Bezos Expeditions、BHP Ventures、Canaan Partners、Emerson Collective、Intel Capital、Khosla Ventures、NVentures（英伟达的风投部门）、Prysm 与 Temasek，此前投资方还有 Gates Frontier 与 Samsung。新闻稿称最新一轮超额认购，原因是客户采用速度快并有多个扩单合同，产品已在数百个复杂的真实工业环境中完成测试与部署。TechCrunch 同日报道写明最新一轮为 3.14 亿美元，由 Bezos Expeditions、Prysm 与 Temasek 联合领投。公司核心产品 Field Foundation Models 定位为面向具身智能的物理优先基础模型，用于在没有先验地图、GPS 或预设路径的动态非结构化环境中运行。
