title:
  zh: 桥介数物完成天使 + 轮及 Pre-A 轮融资，半年内累计三轮「近亿元」
summary:
  zh: 8 月 6 日，桥介数物（深圳）科技有限公司宣布完成天使 + 轮及 Pre-A 轮融资。天使 + 轮投资方包括复星创富、潜能集团等；Pre-A 轮由隐山资本领投，明荟致远、沂景资本等跟投；易凯资本担任独家财务顾问。报道称桥介数物在半年时间内连续完成 3 轮融资，累计金额「近亿元」。公司称资金将用于通用机器人动作开发平台的技术研发、产品升级与人才招聘。
