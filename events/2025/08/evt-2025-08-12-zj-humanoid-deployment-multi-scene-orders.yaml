title:
  zh: 浙江人形机器人创新中心称在手订单几千万元，领航者 2 号已在商超零售、纺织服装等场景落地
summary:
  zh: 8 月 12 日，新浪财经稿件引述浙江人形机器人创新中心首席科学家的说法：中心已与宁波当地企业开展合作，领航者 2 号投入应用于实验室作业、商超零售、纺织服装、家居厨房和展厅导览等场景；公司在手的订单有几千万元，部分已经完成交付。稿件写明中心与产业链上游进行需求对接的上百家企业中有超过 50 家位于宁波。
