title:
  zh: 高擎机电在 2025 世界机器人大会首次公开展示派+（Mini Pi+）
summary:
  zh: 高擎机电官网 8 月活动回顾称，8 月 8 日 2025 年世界机器人大会（WRC2025）在北京亦庄启幕，公司携「海派兄弟」系列机器人参展，其中新成员派+（Mini Pi+）在本次展会上首次公开亮相。官网称派+高度约 65cm、重量 10kg，搭载自研关节模组，支持相机、夹爪、灵巧手、语音控制等功能拓展，可满足 Locomotion、Manipulation、Whole-body Control 等算法研究需求。
