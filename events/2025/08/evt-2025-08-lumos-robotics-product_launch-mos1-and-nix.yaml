summary:
  zh: 鹿明机器人官网里程碑写明 2025 年 8 月发布两款产品：Lumos MOS 1，官网称其为全球首款双臂负载 50 公斤的重载轮式双臂具身机器人；以及 Lumos NIX，一款迷你双足人形机器人。同月官网记录 Lumos LUS2 在首届世界人形机器人运动会团体舞比赛中获得银牌。
