title:
  zh: 英伟达 Jetson AGX Thor 开发者套件正式上市，售价 3,499 美元起
summary:
  zh: 8 月 25 日，英伟达宣布 Jetson AGX Thor 开发者套件与量产模组正式上市，新闻稿写明开发者套件售价 3,499 美元起，Jetson T5000 量产模组由全球分销伙伴提供。该平台基于 Blackwell GPU，技术博客写明配 128GB 内存、最高 2070 FP4 TFLOPS 算力、130W 功耗，相比 Jetson AGX Orin 算力提升最高 7.5 倍、能效提升 3.5 倍，面向人形机器人与手术机器人这类复杂机器人系统。新闻稿列出的早期采用方包括 Agility Robotics、Amazon Robotics、Boston Dynamics、Caterpillar、Figure、Hexagon、Medtronic 与 Meta。
