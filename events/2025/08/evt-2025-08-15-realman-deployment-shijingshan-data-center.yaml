  "summary": {
    "zh": "北京日报报道 8 月 15 日训练中心开放日情况，明确运营方为睿尔曼，中心占地 3000 平方米，拥有 108 台多种形态机器人，覆盖十大实景应用场景，已向海内外大模型与机器人企业提供数据服务。报道描述中心由区企共建、于当年 3 月 28 日落地；本条记录开放日可确认的运营状态。文中年产超百万条为预期产能，不记录为已实现产量。"
