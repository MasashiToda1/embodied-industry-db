title:
  zh: VinMotion 人形机器人在 Vingroup 成立 32 周年活动上做多机同步舞蹈演示
summary:
  zh: 8 月 8 日，VinMotion 的人形机器人在 Vingroup 成立 32 周年庆典上、面向 1000 多名观众做多台同步舞蹈演示。VnExpress 8 月 13 日报道称 VinMotion 表示机器人的机械、电子与软件系统全部由自有工程师开发，公司董事长称这场现场同步演示对稳定性要求高、演示过程未受现场大量观众带来的 Wi-Fi 干扰影响，并称这让团队有信心在实际应用中同时部署多台机器人。公司计划把机器人用于工厂、仓库、接待服务以及超出现有人形机器人物理能力的危险环境。
