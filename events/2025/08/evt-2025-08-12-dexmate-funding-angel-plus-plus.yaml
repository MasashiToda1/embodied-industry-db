title:
  zh: 戴盟机器人完成亿元级天使 ++ 轮融资，招商局创投领投
summary:
  zh: 8 月 12 日，戴盟机器人宣布完成亿元级天使 ++ 轮融资，由招商局创投领投，东方嘉富、架桥资本跟投，资金用于视触觉感知与灵巧操作技术的落地应用。报道写明此前公司完成了昆仲资本独投的天使轮融资，以及国中资本、金鼎资本、联想创投和招银国际联合投资的天使 + 轮融资，三轮累计融资金额达数亿元。
