title:
  zh: 自变量机器人在 2025 世界机器人大会首发轮式双臂仿人形机器人量子 2 号
summary:
  zh: 8 月 8 日，2025 世界机器人大会在北京开幕，自变量机器人在大会上首发全自研轮式双臂仿人形机器人「量子 2 号（Quanta X2）」。报道称该机型采用轮式底盘与仿人形 7 自由度手臂设计，全身最多 62 个自由度，搭载公司自研端到端具身基座大模型 WALL-A，分灵巧手版本与夹爪版本。
