  zh: 宇树 H1 集群参演 2025 年央视春晚创意融合舞蹈《秧BOT》
summary:
  zh: 16 台宇树 H1「福兮」人形机器人与新疆艺术学院演员同台表演创意融合舞蹈《秧BOT》。据报道，H1 依靠高精度 3D 激光 SLAM 自主定位和导航、多智能体协同规划与集群协同控制系统完成队形变换，并通过 AI 驱动全身运动控制技术完成转手绢等动作。
