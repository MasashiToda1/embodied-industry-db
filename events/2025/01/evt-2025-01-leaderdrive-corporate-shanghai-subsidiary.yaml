title:
  zh: 绿的谐波成立全资子公司绿的谐波（上海）传动科技，建具身智能机器人核心零部件研发及服务中心
summary:
  zh: 绿的谐波 2025 年半年报称，公司成立全资子公司上海绿的（绿的谐波（上海）传动科技有限公司），围绕具身智能机器人用核心零部件建设研发及服务中心。腾讯新闻财经稿件称该子公司于 2025 年 1 月在上海成立，注册资本 5000 万元。
