title:
  zh: 松灵机器人推出 Pika 通用具身数据采集方案，官网开放预售
summary:
  zh: 松灵机器人在 Cobot Magic 遥操作数据采集方案之后推出名为 Pika 的通用数据采集方案，由手持数据采集夹爪 Pika Sense、机械臂末端执行夹爪 Pika Gripper、高精度定位基站 Pika Station 三部分组成。报道写明末端执行夹爪重量 690 克，最大夹持力 2 公斤，空间定位精度 ±1.5 毫米，可输出 6D 空间坐标、夹爪开合角度、深度数据、RGB 数据与 IMU 数据；两指夹爪最大开合尺寸 95 毫米。Pika 已在松灵官网开放预售，首批于 2025 年 3 月开启交付，松灵同步开源 Pika 数据集。
