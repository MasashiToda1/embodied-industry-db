title:
  zh: 西湖机器人完成天使+轮融资，原话为「近亿元」
summary:
  zh: 1 月 9 日，西湖机器人科技（杭州）有限公司宣布完成天使+轮融资，报道原话为「共计近亿元」，未披露确定金额。本轮由晶科集团旗下 CVC 金能基金、犇驰资本领投，广州诚信创投等多家机构跟投，天使轮股东天使湾创投持续加注，光源资本担任独家财务顾问。报道写明资金用于端到端具身智能大模型的进化与人形机器人产品迭代、完成客户产品交付。
counterparties:
- 金能基金（晶科集团）
- 犇驰资本
- 广州诚信创投
- 天使湾创投
- 光源资本
