title:
  zh: 灵心巧手发布 Linker Hand 灵巧手钛金版 T10、T20
summary:
  zh: 灵心巧手发布自主研发的 Linker Hand 灵巧手钛金版 T10、T20，售价分别为 19999 元和 49999 元。钛金版采用单指模块化设计和连杆驱动，工业版自由度 25—30 个，科研版最高自由度 42 个，最大负载 5kg，配备摄像头与电子皮肤的视触觉感知系统，支持 ROS 插件与 CAN 总线连接。
