title:
  zh: 禾赛科技在 CES 2025 发布面向机器人的迷你型超半球 3D 激光雷达 JT 系列
summary:
  zh: 2025 年 1 月 7 日（太平洋时间），禾赛科技在 CES 2025 发布面向机器人领域的迷你型超半球 3D 激光雷达 JT 系列，并宣布已开始向客户量产交付。JT 采用禾赛第四代自研芯片，JT128 与 JT32 视场角为 360°×187°，JT16 视场角为 360°×40°，最高支持 256 线，可用于移动机器人、配送机器人、清扫机器人、割草机器人等场景。禾赛称 2024 年 12 月面向机器人市场单月交付激光雷达已超过 20000 台。
