title:
  zh: 奇瑞汽车全资成立安徽墨甲智创机器人科技有限公司
summary:
  zh: 1 月 7 日，安徽墨甲智创机器人科技有限公司成立，注册资本 1 亿元人民币，由奇瑞汽车股份有限公司全资持股，经营范围包含智能机器人销售与研发、工业机器人销售、智能基础制造装备制造、人工智能应用软件与基础软件开发、信息系统集成服务、智能控制系统集成等。
