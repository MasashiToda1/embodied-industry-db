title:
  zh: 傅利叶完成 E 系列融资
summary:
  zh: 1 月 7 日，上海傅利叶智能科技有限公司宣布已完成新一轮融资。据傅利叶披露，E 系列融资共进行了两轮，金额合计「近 8 亿元」。本轮融资由国鑫投资、浦东创投、张江科投、张科垚坤基金、Prosperity7、钧山资本等机构共同参与。
