title:
  zh: 1X Technologies 收购家用人形机器人公司 Kind Humanoid
summary:
  zh: 1 月 27 日，1X Technologies 宣布收购 Kind Humanoid，两家团队合并。Kind Humanoid 是一家位于加州 Palo Alto 的机器人公司，产品为双足人形机器人 Mona，面向家庭与医疗等场景，把仿生机身与大语言模型结合。1X 称此次收购会同时扩充其湾区团队。交易金额未披露。1X 后来向 The Robot Report 确认，Kind Humanoid 的工作没有整合进 NEO Gamma。
