title:
  zh: 星海图完成 A4 轮及 A5 轮战略融资
summary:
  zh: 7 月 9 日，星海图公告完成 A4 轮及 A5 轮战略融资，公告称合计融资金额「超过 1 亿美元」。A4 轮由今日资本、美团龙珠联合领投，中金保时捷基金、襄禾资本以及老股东米哈游、无锡创投集团跟投；A5 轮由美团龙珠、美团战投联合领投，北京机器人基金超额加注，亦庄国投跟投，IDG 资本、BV 百度风投、凯辉基金、今日资本、襄禾资本等老股东持续追投。
