  zh: 光轮智能开源 SimReady 仿真资产库 Lightwheel-simready-asset
summary:
  zh: 7 月 4 日，光轮智能在 GitHub 的 LightwheelAI 组织下开源 Lightwheel-simready-asset 资产库，面向仿真与机器人训练提供 259 个 USD 格式 3D 资产，其中 251 个用于操作训练、8 个用于运动导航训练，资产在 Isaac Lab、遥操作与强化学习流程中做过验证。仓库声明资产免费用于非商业用途，使用时需以 lightwheel_ 前缀命名标注来源。
