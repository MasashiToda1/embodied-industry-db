title:
  zh: 柯力传感战略投资触觉传感芯片公司他山科技
summary:
  zh: 柯力传感与北京他山科技有限公司签署投资协议，完成对他山科技的战略投资，这是柯力继投资猿声科技之后在触觉传感器及电子皮肤领域的又一次投资。他山科技成立于 2017 年，产品为 AI 触感芯片及触觉感知算法，可实现对三维力及物体表面形变、温度、纹理的感知，已与人形机器人、灵巧手和机械臂等多个机器人产业链合作伙伴达成合作。
