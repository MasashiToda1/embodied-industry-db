title:
  zh: ROBOTIS 作业型半人形机器人 AI Worker 于 7 月正式发售
summary:
  zh: ROBOTIS 的 Physical AI 作业型半人形机器人 AI Worker 于 2025 年 7 月正式发售，固定型 FFW-BG2 先上市，随后移动型上市。AI Worker 由操作装置「leader」与跟随其动作的本体「follower」组成，用于物流与制造自动化、非定型物体应对以及模仿学习与强化学习平台。ZDNet Korea 报道公司自研自产全系产品的执行器与减速机，产品价格降到固定型 4000 万韩元区间、移动型 7000 万韩元区间，并称扩大量产数量后固定型可降到 3000 万韩元水平；公司方面表示现场投入仍处于研发阶段，正与大企业物流中心与工厂合作验证。
