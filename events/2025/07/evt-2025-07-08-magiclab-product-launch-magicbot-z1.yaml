  zh: 7 月 8 日，魔法原子发布新款双足人形机器人 MagicBot Z1，具备 24 个基础自由度、最多可扩展至 49 个自由度，结合视觉与触觉感知构建交互系统。产品提供标准版和开发版两个系列，开发版可选装灵巧手、高性能算力包、增加手臂自由度，官方稿写明发布即发售，购买渠道为官网与邮件咨询。
