  zh: 穹彻智能在 WAIC 2025 发布穹彻具身大脑升级版 Noematrix Brain 2.0
summary:
  zh: 2025 年 7 月 26 至 29 日世界人工智能大会期间，穹彻智能发布穹彻具身大脑升级版 Noematrix Brain 2.0，官方称在大模型能力迭代、决策空间压缩和实用特征优化等层面做了升级。同期穹彻展示具身工具链 Noematrix Toolchain 与自研伴随式数采套件 CoMiner，CoMiner 支持仿真或真实环境遥操作与野外采集两种模式。
