title:
  zh: 众擎机器人连续完成 Pre-A++ 轮与 A1 轮融资
summary:
  zh: 7 月 21 日，众擎机器人宣布连续完成 Pre-A++ 轮与 A1 轮融资，两轮合计「近 10 亿元人民币」。Pre-A++ 轮由小鹏汽车作为基石出资人发起设立的星航资本投资；A1 轮由京东领投，宁德时代旗下溥泉资本、银泰集团等产业投资方，以及华控基金、达晨财智旗下国晨基金、黄浦江资本等财务投资方参投。
