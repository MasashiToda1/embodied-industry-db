title:
  zh: 宇树科技在浙江证监局办理 IPO 辅导备案
summary:
  zh: 7 月 18 日，中国证监会官网显示杭州宇树科技股份有限公司已在浙江证监局办理辅导备案。辅导机构为中信证券，律师事务所为北京德恒，会计师事务所为容诚，辅导协议签署时间为 7 月 7 日。辅导工作安排为 2025 年 10 月至 12 月对公司是否达到发行上市条件进行综合评估。
