title:
  zh: Genesis AI 出 stealth，完成 Eclipse 与 Khosla Ventures 联合领投的 1.05 亿美元种子轮
summary:
  zh: 7 月 1 日，Genesis AI 通过 PR Newswire 宣布出 stealth，完成 1.05 亿美元融资，由 Eclipse 与 Khosla Ventures 联合领投，Bpifrance、HSG 以及 Eric Schmidt、Xavier Niel 参投。公司自述为物理 AI 研究实验室与全栈机器人公司，总部列为巴黎与 Palo Alto，目标是构建通用机器人基础模型（RFM）与横向机器人平台。该轮为窗口外补录：截至 2026 年 9 月 22 日这是公司最近一轮已完成融资。
