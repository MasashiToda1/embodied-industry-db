  zh: 优必选宣布在全新一代工业人形机器人 Walker S2 上采用热插拔自主换电系统，可在无须人工干预或关机的情况下 3 分钟完成自主换电。该系统包含双电池动力平衡、标准化电池仓快换与双臂协同精准换电三项技术，机器人可根据任务优先级自主选择换电或充电。
