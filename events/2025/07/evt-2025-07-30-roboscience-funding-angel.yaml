summary:
  zh: RoboScience 官网 2025 年 7 月 30 日公告，公司完成近 2 亿元天使轮融资，由京东领投，招商局创投、商汤国香资本跟投，老股东零一创投继续追投，慕石资本担任本轮独家财务顾问。公告同时说明公司注册成立于
