title:
  zh: Hugging Face 桌面机器人 Reachy Mini 开放订购，Lite 版 299 美元、无线版 449 美元
summary:
  zh: 7 月 9 日，Hugging Face 发布官方博客文章开放 Reachy Mini 订购。TechCrunch 同日报道，Reachy Mini 分两个版本：无线版售价 449 美元、内置 Raspberry Pi 5；Lite 版需连接电脑，售价 299 美元。两版均以开发者自行组装的套件形式提供，机身约毛绒玩具大小，带两块屏幕作眼睛与两根天线，组装后可用 Python 完全编程，预装若干 demo 并与 Hugging Face Hub 打通。报道称 Lite 版将于下月开始发货。原型机于 2025 年 5 月与人形机器人 HopeJR 一同首次公开。
