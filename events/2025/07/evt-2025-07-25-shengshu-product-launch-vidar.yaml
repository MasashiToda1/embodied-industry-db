title:
  zh: 生数科技联合清华大学发布具身基座模型 Vidar
summary:
  zh: 新华网 2025 年 7 月 26 日报道，生数科技携手清华大学于 7 月 25 日发布具身基座模型 Vidar。该模型构建支持机器人双臂协同任务的多视角视频预测框架，并搭配高精度预测逆动力学模型完成动作预测；公司称仅用
    20 分钟机器人真机数据即可泛化到新机器人，所需数据量约为行业均值的千分之一。
