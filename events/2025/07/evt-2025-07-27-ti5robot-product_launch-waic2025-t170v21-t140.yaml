title:
  zh: 钛虎机器人在 2025 WAIC 亮相 T170V2.1 与 T140 人形机器人
summary:
  zh: 钛虎机器人官网新闻称，在 2025 WAIC 世界人工智能大会上，钛虎 T170V2.1 与钛虎 T140 两款人形机器人正式亮相。T170V2.1 采用新一代关节设计，中空孔比例较上一代提升 20%；T140 体积更小，搭配语音交互功能，面向教育培训与家庭陪伴场景。
