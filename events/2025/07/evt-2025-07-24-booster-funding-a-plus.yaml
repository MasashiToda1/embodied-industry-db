title:
  zh: 加速进化完成超亿元 A+ 轮融资
summary:
  zh: 7 月 24 日，北京加速进化科技有限公司宣布完成超亿元人民币 A+ 轮融资，投资方为北京市机器人产业发展投资基金（由首程控股和京国瑞共同管理）、北京市人工智能产业投资基金（由顺禧基金和启明创投共同管理）和博华资本，义柏资本担任长期独家财务顾问。加速进化官网大事记以「加速进化完成 A+ 轮融资」收录同一消息。
