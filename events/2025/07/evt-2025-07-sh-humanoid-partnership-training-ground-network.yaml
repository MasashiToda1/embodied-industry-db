title:
  zh: 国地中心签约共建人形机器人训练场合作生态，在江苏、河南建设训练场分中心
summary:
  zh: 在 2025 世界人工智能大会期间的人形机器人与具身智能创新发展论坛上，国家地方共建人形机器人创新中心与河南分训练场、常熟分训练场，以及中国联通、上海人工智能实验室、百度智能云、华为云等核心单位共同参与训练场合作生态签约。报道写明双方将在江苏、河南建设人形机器人训练场分中心。同场由中国人形机器人百人会发起，国地中心与国家地方共建具身智能机器人创新中心共同发布《人形机器人与具身智能数据采集合作倡议书》，内容包括数据标准互认、数据与工具链共享、数据训练场开放。
counterparties:
- 河南投资集团
- 常熟城投集团
