  zh: 灵心巧手 Linker Hand L6 工业版在 2025 WAIC 首次亮相
summary:
  zh: 在 2025 世界人工智能大会上，灵心巧手的 Linker Hand「工业大师」版灵巧手 L6 首次亮相。L6 工业版针对工业场景的高灵活性、高负载需求开发，具备 6 个主动自由度、12 个总自由度，采用「无刷电机 + 滚珠丝杠」的超强电缸驱动模块与驱控一体化设计。
