title:
  zh: 国地中心在 WAIC 2025 期间发布青龙人形机器人产品矩阵，含青龙 Pro、青龙 Lite、青龙 Wheel
summary:
  zh: 在 2025 世界人工智能大会期间举行的人形机器人与具身智能创新发展论坛上，国家地方共建人形机器人创新中心发布青龙人形机器人产品矩阵，包括青龙 Pro、青龙 Lite、青龙 Wheel 等系列产品，涵盖双足人形机器人与轮臂人形机器人两条技术路线。报道写明青龙 Pro 身高 1.85 米、重 85 公斤，青龙 Lite 身高 1.45 米、重 45 公斤，面向工业、安防、服务、教育及智慧城市等场景。
