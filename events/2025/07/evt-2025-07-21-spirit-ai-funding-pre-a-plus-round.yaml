title:
  zh: 千寻智能完成 PreA+ 轮融资，京东领投
summary:
  zh: 7 月 21 日，千寻智能披露完成 PreA+ 轮融资，原文表述为「近 6 亿元」。本轮由京东领投，中国互联网投资基金、浙江省科创母基金、华泰紫金、复星锐正等跟投，Prosperity7 Ventures、顺为资本、华控基金、千乘资本、靖亚资本、弘晖基金等老股东超额追加，高鹄资本担任独家财务顾问。
