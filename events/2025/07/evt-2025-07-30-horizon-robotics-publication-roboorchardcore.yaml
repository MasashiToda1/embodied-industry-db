summary:
  zh: 7 月 30 日，地平线在 GitHub 的 HorizonRobotics 组织下发布 RoboOrchardCore v0.1.0。RoboOrchardCore 是 RoboOrchard 系列软件包的运行时底座，提供类型化配置、张量化数据类型、管理器驱动的环境循环与命令行工具，让仿真、训练与部署代码共用同一套接口约定。
