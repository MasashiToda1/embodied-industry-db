  zh: 中移（杭州）信息技术有限公司 2025—2027 年人形双足机器人代工服务采购项目总预算 1.2405 亿元（含税），分两个标包。标包 1 为全尺寸双足人形机器人，预算金额 7800 万元（含税），中标人为智元机器人；标包 2 为小尺寸人形机器人、算力背包及五指灵巧手，中标人为宇树科技。
