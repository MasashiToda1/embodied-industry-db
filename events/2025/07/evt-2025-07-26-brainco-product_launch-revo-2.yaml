summary:
  zh: 7 月 26 日，在 2025 世界人工智能大会上，强脑科技发布新一代灵巧手产品 BrainCo 仿生灵巧手 Revo 2。该产品重量 383 克，尺寸 16×7.6 厘米，操作精度 0.1 毫米，握力 50N，承载 20KG，抓重比 52.6，搭载多模态触觉传感器，可感知物体硬度、纹理及受力方向，支持 64V 宽电压与多种通讯协议。
