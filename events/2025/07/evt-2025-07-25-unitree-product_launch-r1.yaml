title:
  zh: 宇树科技发布人形机器人 Unitree R1 智能伙伴，售价 3.99 万元起
summary:
  zh: 7 月 25 日下午，宇树科技在官方微信公众号宣布正式发布第三款人形机器人「Unitree R1 智能伙伴」，售价 3.99 万元起，整机约 25 千克，支持开发与改制，集成语音和图像多模态大模型。宣传视频显示 R1 拥有 26 个关节，可完成翻跟头、倒立行走、奔跑、打拳等动作。
