title:
  zh: 简智机器人完成第三轮（天使轮）融资，顺为资本领投；成立 4 个月三轮融资总额超 2 亿元
summary:
  zh: 12 月 18 日，据顺为资本官微消息，简智机器人完成第三轮融资，为公司成立 4 个月内的第 3 轮，三轮总额「超 2 亿元」。种子轮由 BV 百度风投领投，Momenta、九识、星海图跟投；种子 + 轮由速腾聚创领投，BV 百度风投跟投；天使轮由顺为领投，初心资本、BV 百度风投超额跟投。
