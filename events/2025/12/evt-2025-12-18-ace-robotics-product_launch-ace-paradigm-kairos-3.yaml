title:
  zh: 大晓机器人正式亮相，发布 ACE 具身研发范式、开悟世界模型 3.0（Kairos 3.0）与具身超级大脑模组 A1
summary:
  zh: 12 月 18 日，上海大晓无限机器人有限公司召开发布会，正式发布以环境式数据采集为引擎的 ACE 具身研发范式、开源且商业应用的开悟世界模型 3.0（Kairos 3.0，覆盖 115 个垂类具身场景，当日面向全行业开源）以及具身超级大脑模组 A1，并上线开悟具身智能世界模型产品平台。发布会上宣布与智元机器人达成战略合作，展示了面向即时零售场景的机器人和搭载 A1 模组的巡检机器狗；开悟世界模型 3.0 已与沐曦、壁仞、中科曙光等国产芯片产品完成适配。
