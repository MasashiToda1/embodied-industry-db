title:
  zh: 银河通用完成超 3 亿美元新一轮融资，中国移动链长基金领投
summary:
  zh: 2025 年 12 月 19 日新闻稿称，近日银河通用官宣完成新一轮超 3 亿美元融资，由中国移动链长基金领投，中金资本、中科院基金、苏创投、央视融媒体基金、天奇股份等联合注资，并获得新加坡、中东的国际投资机构及老股东加注。新闻稿称累计融资额约 8 亿美元，估值达 30 亿美元。
