title:
  zh: 北京十六号机器人科技有限公司成立
summary:
  zh: 观点网报道，前月之暗面后训练与强化学习负责人宋鸿涌于 2025 年 12 月离职，创立北京十六号机器人科技有限公司，聚焦通用人形机器人基座模型。企查查信息显示公司成立于 2025 年 12 月 17 日，法定代表人宋鸿涌，注册资本 100 万元。
