title:
  zh: 美蓓亚三美与哈默纳科联合开发面向人形机器人手部的高扭矩微型执行器，在 CES 2026 首次公开演示
summary:
  zh: 12 月 16 日，美蓓亚三美（MinebeaMitsumi）发布新闻稿称将首次参展 CES 2026（2026 年 1 月 6—9 日），展出与 Harmonic Drive Systems 联合开发的机器人手用高扭矩微型齿轮执行器（尺寸 W 13mm × H 19.4mm × L 60.4mm），并首次公开演示搭载该执行器的机器人手：单指可提起 5kg 物体，指尖集成美蓓亚三美应变传感器以感知物体软硬。新闻稿称该展示面向人形机器人领域。
