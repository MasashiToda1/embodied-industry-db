summary:
  zh: 12 月 9 日，杭州云深处科技股份有限公司宣布完成超 5 亿元人民币 C 轮融资，由招银国际和华夏基金联合领投，中国电信、中国联通旗下基金参与战略投资，云晖资本、中芯聚源、浙大基金会、首程控股等跟投，达晨财智、前海方舟、央视融媒体基金、北京机器人产业发展投资基金和华映资本等老股东继续加持。
