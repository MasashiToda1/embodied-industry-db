title:
  zh: 千寻智能人形机器人「小墨」在宁德时代中州基地电池 PACK 产线规模化上岗
summary:
  zh: 12 月 17 日，千寻智能宣布其人形机器人「小墨」正式在宁德时代中州基地新能源动力电池 PACK 生产线上岗，承担电池包下线前 EOL 与 DCR 工序的高压测试插头插接作业。官方称机器人搭载端到端视觉-语言-动作（VLA）模型，插接成功率稳定在 99% 以上，单日工作量较人工提升三倍。
