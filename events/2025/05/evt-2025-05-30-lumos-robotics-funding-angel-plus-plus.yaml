title:
  zh: 鹿明机器人完成天使++轮融资，天使轮累计融资原话为「近 2 亿」
summary:
  zh: 5 月 30 日，鹿明机器人宣布完成天使++轮融资，投资方包括复星锐正、德马科技（688360.SH）和吴中金控，本轮未披露金额。报道写明这是公司两个月内完成的第二轮融资、半年内完成的第三轮融资，天使轮累计融资原话为「近 2 亿」。资金用于完善产品及深化产业协同，加速与产业方的合作。
