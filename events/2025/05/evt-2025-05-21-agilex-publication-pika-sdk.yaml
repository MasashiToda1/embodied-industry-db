title:
  zh: 松灵机器人开源 Pika 系列设备的 Python SDK
summary:
  zh: 松灵机器人在自有 GitHub 组织 agilexrobotics 下建立 pika_sdk 仓库，开源面向 Pika 系列设备的 Python 软件开发工具包，许可证为 LGPL-3.0。README 写明 SDK 支持 Pika Sense 与 Pika Gripper 两类设备，运行环境为 x86_64 / arm64 架构、Ubuntu 20.04 或 22.04、Python 3.9 及以下，并依赖 Intel RealSense SDK。
