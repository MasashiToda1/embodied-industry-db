title:
  zh: NEURA Robotics 与 SAP、NVIDIA 达成战略合作，把企业系统接到机器人执行端
summary:
  zh: 5 月 28 日，NEURA Robotics 宣布与 SAP 和 NVIDIA 达成战略合作。公告给出的四步流程是：在 NVIDIA Isaac Sim 里用 SAP 的应用数据与 AI 模型训练新的机器人用例；在 NVIDIA Omniverse 里结合 SAP 的业务上下文与数字孪生做验证；验证通过后把 AI 模型与 SAP agent 部署到 Neuraverse 生态或直接部署到机器人上；机器人执行任务时把反馈数据回传给 SAP 与 NVIDIA，闭合学习回路。
