title:
  zh: 国家机器人检测与评定中心颁出全球首张人形机器人 CR 认证「001」证书
summary:
  zh: 在 5 月 29 日于上海浦东张江科学会堂举行的 2025 张江具身智能开发者大会上，国家机器人检测与评定中心（总部）向上海智元新创技术有限公司颁发全球首张人形机器人 CR 认证「001」证书，受证产品为智元远征 A2。该产品通过机械电气安全、电磁兼容性、功能安全、智能化等检测评估。智元同日宣布远征 A2 另通过欧盟 CE-MD、CE-RED 与美国 FCC 认证。
