title:
  zh: 傲意科技完成近亿元 B++ 轮融资
summary:
  zh: 5 月 13 日消息，傲意科技近期已完成近亿元 B++ 轮融资，由英飞尼迪资本、浙江省国有资本运营有限公司旗下浙江省发展资产经营有限公司、沃美达资本共同投资，升氪剂资本担任长期财务顾问。本轮募集资金将用于灵巧手技术研发投入、新产品上市进程以及产能建设和市场拓展。
