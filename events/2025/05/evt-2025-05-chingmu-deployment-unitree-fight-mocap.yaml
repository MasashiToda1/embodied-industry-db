summary:
  zh: 青瞳视觉官网披露，宇树科技人形机器人在 CMG 世界机器人格斗擂台赛与 UFC 精英训练中心两场活动的赛前训练中，均采用青瞳视觉的光学动捕系统进行格斗训练数据采集，对格斗运动员的位姿、速度等指标进行捕捉，记录肢体关节角度变化以及出拳速度、运动轨迹连贯性等信息，用于机器人动作执行评估与控制算法优化。
