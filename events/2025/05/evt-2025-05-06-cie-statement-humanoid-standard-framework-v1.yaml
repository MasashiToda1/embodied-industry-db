title:
  zh: 中国电子学会牵头编制的《人形机器人标准体系框架（V1.0 版）》发布
summary:
  zh: 中国电子学会官网稿件载，在工业和信息化部领导下，学会组织机器人企业、科研院所、高校等 120 余家单位编制完成《人形机器人标准体系框架（V1.0 版）》，并在「人形机器人百人会会议暨人工智能赋能新型工业化深度行（无锡站）」活动上正式发布。框架从基础共性、关键技术、部组件、整机与系统、应用等 5 个方面建立全链条标准体系，并梳理了行业急需标准项目清单。
