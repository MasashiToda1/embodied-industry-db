title:
  zh: 魔法原子完成数亿元新一轮战略融资
summary:
  zh: 5 月 16 日消息，具身智能机器人公司魔法原子宣布完成数亿元新一轮战略融资。投资方包括战略产业资本禾创致远、芯联资本，财务投资人华映资本、晓池资本、元禾厚望，老股东追创创投和翼朴基金持续追加投资。报道称资金用于具身智能核心技术迭代研发、VLA 模型搭建与工业、商业场景落地，公司当年启动 400 台人形机器人生产。
