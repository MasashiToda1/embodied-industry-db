summary:
  zh: 5 月 6 日，逐际动力在 GitHub 账号 limxdynamics 下同日创建并公开 humanoid-description 与 humanoid-mujoco-sim 两个仓库。前者提供全尺寸人形机器人 HU_D03、HU_D04 的 URDF、MuJoCo MJCF 与 USD 模型，适配 ROS、MuJoCo 与 NVIDIA Isaac Sim；后者是这两款人形机器人的 MuJoCo 仿真环境，用于可视化模型、测试运动控制器并在部署到硬件前验证强化学习策略。
