title:
  zh: 西湖机器人推出小型四足机器人「傲天」，在广交会展出
summary:
  zh: 每日商报稿件写明西湖机器人最新研发的高性能小型四足机器人「傲天」在最新一届广交会上展出并与宾客互动。稿件写明该机型借助企业自研的多模态大模型实现语音交互、指令下达、危险预警、环境探测；两大特点为预置图像检测定位系统（使用者只需添加传感器即可投入使用）与内置「大脑+小脑」系统，面向养老、医疗、安防、巡检等场景。
