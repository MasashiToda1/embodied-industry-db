  zh: 优理奇公开 Wanda 2.0 分档定价，基础版 8.8 万元
summary:
  zh: 新华日报财经稿件写明优理奇量产产品 Wanda 2.0 基础版定价 8.8 万元，具备 6 至 8 小时续航与基础操作能力；高阶版定价 18.8 万元与 26.8 万元，负载提升至 6 公斤，续航达 16 小时，并分别配备 100 TOPS 和 275 TOPS 算力的交互大模型。稿件写明该定价基于自研硬件与本地化供应链，公司核心部件全自研，80% 硬件自主设计。
