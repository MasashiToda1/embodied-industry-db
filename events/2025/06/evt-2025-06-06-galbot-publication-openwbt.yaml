title:
  zh: 银河通用开源人形机器人全身遥操作系统 OpenWBT
summary:
  zh: 银河通用在 GitHub 开源 OpenWBT，仓库署名「GALBOT · Tsinghua」，采用 Apache-2.0 许可。README 说明该项目用 Apple Vision Pro 实现宇树 G1 与 H1 人形机器人的全身遥操作，支持实机与仿真环境，单个操作员即可控制机器人完成行走、下蹲、弯腰、抓取、举起等动作；下半身由手柄控制，上半身通过 VR 测得的人手位姿经逆运动学解算得到；项目支持在 Isaac Sim 中做遥操作仿真。
