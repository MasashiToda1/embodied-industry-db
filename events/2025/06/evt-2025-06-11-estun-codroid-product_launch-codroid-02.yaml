title:
  zh: 埃斯顿酷卓发布第二代人形机器人 Codroid 02
summary:
  zh: 6 月 11 日上午，埃斯顿酷卓在 2025 智能机器人发展大会上发布第二代人形机器人 Codroid 02。官方介绍该机型身高 170cm、体重 70kg、单臂负载 5 公斤，全身自由度可达 31 个（不含灵巧手），全身一体化关节模组由公司自主研发；控制系统采用快慢系统的智能体架构，现场以视频演示了部件抓取、物料搬运、螺丝锁付、质检巡检等工业场景任务。
