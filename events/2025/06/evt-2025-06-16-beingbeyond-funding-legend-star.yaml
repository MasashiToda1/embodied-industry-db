summary:
  zh: 2025 年 6 月 16 日消息，北京智在无界科技有限公司（BeingBeyond）完成融资，原文表述为「数千万元」。联想之星领投，星连资本（智谱 Z 基金）、燕缘创投、彬复资本跟投，势能资本担任独家财务顾问。资金用于核心技术研发投入、现有模型迭代与产业化验证。
