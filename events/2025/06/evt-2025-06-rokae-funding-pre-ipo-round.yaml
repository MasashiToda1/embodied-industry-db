title:
  zh: 珞石机器人完成上市前最后一轮融资
summary:
  zh: 投中网报道，2025 年 6 月珞石机器人完成上市前最后一轮融资，从金沙江联合资本处获得 1.95 亿元，估值达到 52.95 亿元。报道称珞石机器人自成立以来共经过 10 轮融资，股东包括梅花创投、德联资本、清控银杏、顺为资本、金沙江联合资本、襄禾资本、深创投、远翼投资、新希望集团、国家制造业转型升级基金、新业资本等。
