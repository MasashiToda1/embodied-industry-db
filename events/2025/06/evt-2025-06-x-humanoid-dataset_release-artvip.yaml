title:
  zh: 北京人形机器人创新中心发布铰接数字资产集 ArtVIP
summary:
  zh: 北京人形机器人创新中心以 X-Humanoid 账号在 Hugging Face 发布 ArtVIP 数据集，任务类别标注为 Robotics，许可为 Apache-2.0，标签为 usd、articulations 与 Robotics simulation，关联论文 arXiv:2506.04941。页面版本历史记录 v1.0 于 2025-06 初始发布，包含 206 个铰接物体与 6 个交互场景；数据集特性包括数字孪生铰接物体、可复用模块化交互、物理保真度与像素级 affordance 标注。
