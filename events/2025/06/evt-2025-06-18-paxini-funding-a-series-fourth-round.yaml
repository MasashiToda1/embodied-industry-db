title:
  zh: 帕西尼完成新一轮 A 系列融资
summary:
  zh: 6 月 18 日消息，帕西尼感知科技已于近日完成新一轮 A 系列融资，为其 A 系列的第四轮融资。投资方包括 TCL 创投、毅达资本、尚颀资本、基石资本、商汤国香、中信里昂、湖南财信产业基金、钧犀资本等，累计融资金额为数亿元人民币，庚辛资本中国担任独家战略财务顾问。募资用途为触觉感知核心技术迭代、具身智能多模态数据规模化采集、具身智能大模型研发以及产线扩张。
