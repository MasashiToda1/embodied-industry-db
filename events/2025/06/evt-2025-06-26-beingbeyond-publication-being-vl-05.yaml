  zh: 2025 年 6 月 26 日，BeingBeyond 公布 Being-VL-0.5，并于 6 月 30 日在 GitHub 组织下建立同名仓库，7 月 12 日放出代码与训练脚本。README 称该模型把字节对编码（BPE）直接用于视觉 token，提出 Visual Byte-Pair Encoding（vBPE），以统一表示处理图文理解。对应论文《Unified Multimodal Understanding via Byte-Pair Visual Encoding》收录于 ICCV 2025，7 月 24 日入选 Highlight。
