title:
  zh: 银河通用完成由宁德时代领投的 11 亿元新一轮融资
summary:
  zh: 6 月 23 日，北京银河通用机器人有限公司宣布已于 6 月正式完成由宁德时代领投的 11 亿元人民币新一轮融资，两年累计融资超 24 亿元。本轮投资方包括宁德时代上市公司战投、溥泉资本（CATL Capital）、国家开发银行国开科创、北京机器人产业基金、纪源资本等。
