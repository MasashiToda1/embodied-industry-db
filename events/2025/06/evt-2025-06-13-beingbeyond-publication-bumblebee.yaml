title:
  zh: BeingBeyond 发布人形机器人全身控制框架 BumbleBee
summary:
  zh: "2025 年 6 月 13 日，BeingBeyond 在 GitHub 组织下建立 BumbleBee 仓库。README 称 BumbleBee 是面向人形机器人通用敏捷全身控制的「专家—通才」学习框架，先用基于自编码器的聚类方法把行为相近的动作分组并在各簇内训练专家策略，再以真实世界数据通过迭代 delta action 建模弥合 sim-to-real 差距，最后把专家策略蒸馏为统一的通才控制器。对应论文《From Experts to a Generalist: Toward General Whole-Body Control for Humanoid Robots》收录于 NeurIPS 2025（Spotlight）。"
