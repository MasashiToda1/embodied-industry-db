summary:
  zh: 6 月 12 日，地平线团队将 EmbodiedGen 论文提交至 arXiv，并在 GitHub 的 HorizonRobotics 组织下开源代码。EmbodiedGen 是交互式 3D 世界生成平台，可低成本批量生成带真实物理属性与真实尺度、以 URDF 格式输出的可控 3D 资产，用于具身智能任务的训练与评测。
