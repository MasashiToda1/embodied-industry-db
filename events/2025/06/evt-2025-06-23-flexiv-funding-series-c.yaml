title:
  zh: 非夕科技宣布完成 C 轮融资
summary:
  zh: 6 月 23 日，非夕科技宣布完成亿级美元 C 轮融资，由咏归基金与广发信德联合领投，洪泰基金、华控基金等跟投，老股东高榕创投、eGarden Ventures、Mfund 魔量资本继续参与。公司表示融资资金将用于扩产、技术研发和生态建设。原文表述为「亿级美元」，未披露确定金额。
