title:
  zh: 灵童机器人「念 NIA-F01」桌面人形机器人与「璇玑」蛋形机器人首发上线京东
summary:
  zh: 6 月 13 日，灵童念 NIA-F01 人形机器人与「璇玑」蛋形机器人首发上线京东并正式开售。念 NIA-F01 为桌面尺寸人形机器人，约为人类三分之一大小，首发期间限时到手价 9999 元；「璇玑」蛋形机器人到手价 99 元，用于孵化与迁移机器人的「灵魂」。两款产品均接入京东 Joy Inside 对话智能体，支持角色定制与性格设定。
