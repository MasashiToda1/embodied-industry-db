title:
  zh: 云深处发布山猫 M20 行业级全地形轮足机器人
summary:
  zh: 4 月 29 日，云深处科技发布山猫 M20 轮足机器人，官方称这是面向复杂地形和危险环境打造的中型行业级全地形轮足机器人。整机有效负载 15 公斤、负载续航 12 公里，配 96 线激光雷达，支持全向避障，工业级 IP66 防护，可选自主导航与自主充电的 Pro 版本。官网产品页列出的应用场景为电力巡检、消防应急、物流配送与科研探索，发布时开启全球预售，未公布售价。
