title:
  zh: 珞石机器人全新一代人形机器人在山东省机器人大会首次公开亮相
summary:
  zh: 4 月 26 日，2025 山东省机器人大会在邹城启幕，珞石机器人全新一代人形机器人首次公开亮相，并在开幕式上发布《2025 机器人山东宣言》。官网介绍该人形机器人依托全栈自研核心技术与全力控关节协作机器人产品，融合多模态感知融合技术与 VLA 大模型智能中枢，结合模仿学习与强化学习算法；同场展出焊接、打磨、码垛、力控装配等 15 项以上应用方案。
