title:
  zh: 众擎机器人完成 Pre-A 轮融资
summary:
  zh: 据众擎机器人官方微信公众号消息，公司完成新一轮 Pre-A 轮融资，融资总额「近 2 亿元人民币」，由 Stone Venture 领投，商汤国香资本、弘晖基金、浔商创投、包河创投等老股东持续加码。资金将用于人形机器人本体、小脑以及具身智能的研发与升级，并推动大规模生产与国内外市场拓展。
