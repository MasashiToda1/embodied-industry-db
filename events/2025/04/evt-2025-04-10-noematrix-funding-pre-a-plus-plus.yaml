summary:
  zh: 2025 年 4 月 10 日，穹彻智能宣布完成 Pre-A++ 轮融资，官网表述为「数亿元」。本轮新增盛宇投资、清科创投、嘉御资本、云启资本、上海科创集团等机构，老股东 Prosperity7、红杉中国、小苗朗程、璞跃中国持续追投。融资用于具身智能基础模型、数据采集与评价等方向，并推动零售履约、家庭服务、食品加工等场景的商业化应用探索。
