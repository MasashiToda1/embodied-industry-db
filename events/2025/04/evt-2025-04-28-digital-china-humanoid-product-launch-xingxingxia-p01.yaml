title:
  zh: 数字华夏发布双形态人形机器人星行侠 P01
summary:
  zh: 4 月 28 日，数字华夏（深圳）科技有限公司正式发布 IP 系列机器人星行侠 P01，官方称其为全球首款双形态人形机器人。产品支持「本体模式」与搭载「风火轮」自适应底盘的「飞兵模式」自由切换，具备双足行走、轮式移动、导航避障、自动充电和电梯联动跨楼层能力，续航超过 10 小时，面向商场、展馆、办公楼等场景。星行侠是继夏澜、夏起之后的第三款重点人形机器人产品，发布即开启预售、招募 100 名创始版用户，价格未公布。
