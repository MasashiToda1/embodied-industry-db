title:
  zh: 特斯拉在 2025 年一季度股东信中称 Optimus 将在弗里蒙特试产线上生产
summary:
  zh: 4 月 22 日，特斯拉发布 2025 年第一季度股东更新文件，其中写道公司「仍按计划在 2025 年于弗里蒙特试产线（Fremont pilot production line）上制造 Optimus，并在自家工厂里更大范围部署机器人做有用的工作」。同一份文件的图片页标注为「OPTIMUS - FREMONT PILOT PRODUCTION LINE」。
