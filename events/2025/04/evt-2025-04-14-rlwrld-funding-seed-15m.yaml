title:
  zh: RLWRLD 完成 1500 万美元种子轮，韩日产业方与风投共同参与
summary:
  zh: 4 月 14 日，RLWRLD 发布公告宣布完成 1500 万美元种子轮融资，投资方包括 LG Electronics、SK Telecom、KDDI、ANA Holdings、Mitsui Chemicals、Shimadzu Corporation 等韩日产业公司，以及 Hashed、Mirae Asset、Global Brain 等风险投资机构。公司称资金用于扩展产业伙伴现场的数据管线、推进机器人基础模型技术栈、加深与亚洲及北美机器人与传感器公司的集成，并与 KAIST、首尔大学、POSTECH 及 WIRobotics、Rainbow Robotics、Wonik Robotics、ROBOTIS 等机器人厂商建立合作生态。TechCrunch 同日报道该轮为 210 亿韩元、由 Hashed 领投。
