title:
  zh: 动易科技完成天使+轮融资，天使轮累计融资额超亿元
summary:
  zh: 4 月 17 日，通用人形机器人公司动易科技宣布完成天使+轮融资，天使轮累计融资额超亿元。本轮由清智资本领投，普超资本跟投，老股东峰瑞资本、Z 基金（智谱生态基金）追投，麟阁创投、信雅达、银杏谷资本、水木清华校友种子基金持续加码。报道称资金主要用于技术研发、团队扩充及产品商业化落地。
