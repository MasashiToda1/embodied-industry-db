title:
  zh: 星海图接连完成 A2、A3 轮系列融资
summary:
  zh: 4 月 3 日消息，星海图接连完成 A2、A3 轮系列融资，报道称总融资额「超 3 亿元人民币」，华兴资本担任独家财务顾问。本系列融资由凯辉基金领投，联想创投、海尔资本等产业资本参投，老股东 IDG 资本、高瓴创投、百度风投、同歌创投等追投。报道称截至 A3 轮，星海图 2025 年展开的 A 轮系列累计融资总额约 1 亿美元。
