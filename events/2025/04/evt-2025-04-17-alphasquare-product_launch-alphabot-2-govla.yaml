title:
  zh: 智平方发布通用智能机器人 AlphaBot 2 与全域全身 VLA 大模型 GOVLA
summary:
  zh: 2025 年 4 月 17 日，智平方在深圳发布新一代通用智能机器人 AlphaBot 2（爱宝 2），并将原具身大模型品牌 AI2R Brain 升级为 Alpha Brain。官网称 Alpha Brain 搭载自研全域全身 VLA 大模型 GOVLA（Global & Omni-body Vision-Language-Action），由空间交互基础模型、慢系统与快系统三部分组成，慢系统负责推理与任务拆解、快系统输出全身控制动作与移动轨迹。发布会同时宣布启动自有产线建设。
