name: Gate

# 每个分支都跑，PR 到 main 也跑。
# 本地 make preflight 不能替代这里——环境不一定一致，最终以 PR Checks 为准。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装依赖
        run: pip install --quiet pyyaml beautifulsoup4 lxml httpx

      # 词表和枚举先过一遍语法，后面所有检查都依赖它们
      - name: 词表自检
        run: |
          python - <<'PY'
          import glob, yaml, sys
          bad = 0
          for f in sorted(glob.glob("vocab/*.yaml")):
              try:
                  yaml.safe_load(open(f))
                  print(f"  OK   {f}")
              except Exception as e:
                  print(f"  FAIL {f}: {e}"); bad = 1
          sys.exit(bad)
          PY

      - name: 门禁（真实数据）
        run: make lint PY=python

      - name: 夹具（合规必过 / 违规必拒）
        run: make test PY=python

      - name: 解析器测试（不打网络）
        run: make test-ingest PY=python

      - name: 编译视图
        run: make build PY=python

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 投资方别名与去重回归
        run: |
          python scripts/build_site.py --root . --out docs/data
          node tests/test_investor_aliases.cjs
          node tests/test_research_signals.cjs

      # 一手来源第三方核验不了，所以在 PR 里显式列出来，让它始终可见
      - name: 列出一手来源事件
        run: python scripts/lint.py --root . | grep -A50 "一手来源事件" || echo "（本次无一手来源事件）"

      # 把受影响主体的真实编译结果展示给审核者，不手写视图。
      - name: 受影响主体预览
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          base = os.environ.get("BASE_SHA", "")
          if not base or set(base) == {"0"}:
              base = subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"], text=True
              ).strip()
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=AM", base, "HEAD",
               "--", "events/", "registry/orgs/"], text=True
          ).splitlines()
          orgs = set()
          for name in paths:
              path = Path(name)
              if path.suffix != ".yaml" or not path.is_file():
                  continue
              doc = yaml.safe_load(path.read_text()) or {}
              if name.startswith("events/"):
                  orgs.update(item["id"] for item in doc.get("orgs", []))
              else:
                  orgs.add(doc["id"])
          rendered = []
          for oid in sorted(orgs):
              page = Path("build/orgs") / (oid + ".md")
              # 只读编译器生成的主体文件。
              if page.resolve().parent != Path("build/orgs").resolve():
                  raise ValueError("Invalid org id")
              rendered.append(page.read_text())
          summary = "\n\n".join(rendered) or "本次没有受影响的主体。"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          PY
