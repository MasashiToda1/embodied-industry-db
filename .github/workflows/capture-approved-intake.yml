name: Capture approved intake sources
on: [push]
permissions:
  contents: write
jobs:
  capture:
    if: github.ref == 'refs/heads/agent/issue-intake-oct03-a6d2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original public pages
        shell: bash
        run: |
          mkdir -p snapshots/2026/10/intake-20261003
          curl -fLsS --retry 2 --max-time 45 -A 'Mozilla/5.0' 'https://www.nda.gov.cn/sjj/ywpd/szkjyjcss/1031/20251031193216150911981_pc.html' -o snapshots/2026/10/intake-20261003/nda.html
          curl -fLsS --retry 2 --max-time 45 -A 'Mozilla/5.0' 'https://kw.beijing.gov.cn/xwdt/kcyx/xwdtshgg/202508/t20250818_4175247.html' -o snapshots/2026/10/intake-20261003/beijing.html
          python - <<'PY'
          from pathlib import Path
          for name, phrase in [('nda','2.5PB'), ('beijing','108')]:
              text = Path('snapshots/2026/10/intake-20261003/' + name + '.html').read_text()
              assert phrase in text, name + ': expected source content missing'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots/2026/10/intake-20261003
          git commit -m '保存已批准线索的政府来源原始页面'
          git push
