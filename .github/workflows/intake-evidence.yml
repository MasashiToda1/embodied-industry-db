name: Intake evidence audit
on:
  push:
    branches: ["agent/intake-evidence-d4a9"]
    paths: ["evidence-urls.json", "evidence-fetch.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 保存公开来源原文
        run: |
          pip install --quiet beautifulsoup4 pypdf pyyaml
          python evidence-fetch.py
      - name: 保存核验快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-readable
          git commit -m "取证：提取阅读文本并生成去重索引"
          git push
