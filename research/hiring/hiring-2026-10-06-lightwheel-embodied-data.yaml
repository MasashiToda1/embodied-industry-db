judgment: 多类岗位共同支持公司在补齐端到端数据生产与质量治理能力；不能据此认定平台各环节已经上线。
limitations: 岗位职责表示招聘目标，不等于项目、产品或客户交付已经完成。 VLA、Sim2Real及具体仿真工具可能出现在协作项或经验要求中，不能直接认定为现用技术栈。 岗位数量不能用于推算团队规模、招聘人数或业务收入。 首次基线，无上月可比记录；证据组数不代表岗位种类、人数或研发投入。
